/* ================= audio core ================= */
let _ctx=null;
function AC(){ if(!_ctx){ _ctx=new (window.AudioContext||window.webkitAudioContext)(); } return _ctx; }
async function decodeFile(f){ const ab=await f.arrayBuffer(); return await AC().decodeAudioData(ab); }

function toInt16(f32){
  const i16=new Int16Array(f32.length);
  for(let i=0;i<f32.length;i++){ let v=f32[i]; v=v<-1?-1:v>1?1:v; i16[i]=v<0?v*32768:v*32767; }
  return i16;
}
function wavBlob(buf){
  const nc=buf.numberOfChannels, sr=buf.sampleRate, len=buf.length;
  const ba=nc*2, ds=len*ba, ab=new ArrayBuffer(44+ds), dv=new DataView(ab);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF'); dv.setUint32(4,36+ds,true); ws(8,'WAVE'); ws(12,'fmt ');
  dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,nc,true);
  dv.setUint32(24,sr,true); dv.setUint32(28,sr*ba,true); dv.setUint16(32,ba,true); dv.setUint16(34,16,true);
  ws(36,'data'); dv.setUint32(40,ds,true);
  const ch=[]; for(let c=0;c<nc;c++)ch.push(buf.getChannelData(c));
  let o=44;
  for(let i=0;i<len;i++){ for(let c=0;c<nc;c++){ let v=ch[c][i]; v=v<-1?-1:v>1?1:v; dv.setInt16(o,v<0?v*32768:v*32767,true); o+=2; } }
  return new Blob([ab],{type:'audio/wav'});
}
function resampleLinear(buf,targetSR){
  const out=AC().createBuffer(2,buf.length,targetSR);
  const nc=Math.min(2,buf.numberOfChannels);
  for(let c=0;c<nc;c++){
    const d=buf.getChannelData(c), o=out.getChannelData(c);
    const ratio=buf.sampleRate/targetSR;
    for(let i=0;i<o.length;i++){ const t=i*ratio, i0=Math.floor(t), i1=Math.min(d.length-1,i0+1), f=t-i0; o[i]=d[i0]*(1-f)+d[i1]*f; }
  }
  return out;
}
function mp3Blob(buf,kbps=160){
  try{
    const L=window.lamejs; if(!L||!L.Mp3Encoder) return null;
    let b=buf, sr=buf.sampleRate;
    const ok=[44100,48000,32000,22050,16000,11025,8000].includes(sr);
    if(!ok){ b=resampleLinear(buf,44100); sr=44100; }
    const nc=b.numberOfChannels, len=b.length;
    const enc=new L.Mp3Encoder(nc,sr,Math.min(kbps,320));
    const bs=1152, out=[];
    const Lch=toInt16(b.getChannelData(0));
    const Rch=nc>1?toInt16(b.getChannelData(1)):Lch;
    for(let i=0;i<len;i+=bs){
      const l=Lch.subarray(i,Math.min(len,i+bs));
      const r=Rch.subarray(i,Math.min(len,i+bs));
      const d=nc>1?enc.encodeBuffer(l,r):enc.encodeBuffer(l);
      if(d.length)out.push(d);
    }
    const e=enc.flush(); if(e.length)out.push(e);
    return new Blob(out,{type:'audio/mpeg'});
  }catch(err){ console.warn('mp3 encode failed',err); return null; }
}
function sliceBuf(buf,a,b){
  const sr=buf.sampleRate, i0=Math.max(0,Math.floor(a*sr));
  const n=Math.min(buf.length-i0,Math.max(1,Math.ceil(Math.max(0,b-a)*sr)));
  const out=AC().createBuffer(buf.numberOfChannels,n,sr);
  for(let c=0;c<buf.numberOfChannels;c++) out.getChannelData(c).set(buf.getChannelData(c).subarray(i0,i0+n));
  return out;
}
function exportBuffer(buf,name,fmt){
  if(fmt==='mp3'){
    const m=mp3Blob(buf,160);
    if(m){ downloadBlob(m,name+'.mp3'); return; }
    toast('MP3 encoder unavailable — saved as WAV');
  }
  downloadBlob(wavBlob(buf),name+'.wav');
}

/* ---- minimal ZIP writer (store method, no compression) ---- */
let _crcT=null;
function crc32(u8){
  if(!_crcT){ _crcT=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; _crcT[n]=c; } }
  let crc=0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) crc=_crcT[(crc^u8[i])&0xFF]^(crc>>>8);
  return (crc^0xFFFFFFFF)>>>0;
}
function zipBlob(files){
  const enc=new TextEncoder(), chunks=[], central=[];
  let offset=0;
  const d=new Date();
  const dosD=((d.getUTCFullYear()-1980)<<9)|((d.getUTCMonth()+1)<<5)|d.getUTCDate();
  const dosT=(d.getUTCHours()<<11)|(d.getUTCMinutes()<<5)|(d.getUTCSeconds()>>1);
  for(const f of files){
    const nameB=enc.encode(f.name), crc=crc32(f.data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0,true); lh.setUint16(8,0,true);
    lh.setUint16(10,dosT,true); lh.setUint16(12,dosD,true);
    lh.setUint32(14,crc,true); lh.setUint32(18,f.data.length,true); lh.setUint32(22,f.data.length,true);
    lh.setUint16(26,nameB.length,true); lh.setUint16(28,0,true);
    chunks.push(new Uint8Array(lh.buffer),nameB,f.data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true);
    ch.setUint16(8,0,true); ch.setUint16(10,0,true);
    ch.setUint16(12,dosT,true); ch.setUint16(14,dosD,true);
    ch.setUint32(16,crc,true); ch.setUint32(20,f.data.length,true); ch.setUint32(24,f.data.length,true);
    ch.setUint16(28,nameB.length,true); ch.setUint16(30,0,true); ch.setUint16(32,0,true);
    ch.setUint16(34,0,true); ch.setUint16(36,0,true);
    ch.setUint32(38,0,true); ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer),nameB);
    offset+=30+nameB.length+f.data.length;
  }
  const csize=central.reduce((s,c)=>s+c.length,0);
  const eo=new DataView(new ArrayBuffer(22));
  eo.setUint32(0,0x06054b50,true); eo.setUint16(4,0,true); eo.setUint16(6,0,true);
  eo.setUint16(8,files.length,true); eo.setUint16(10,files.length,true);
  eo.setUint32(12,csize,true); eo.setUint32(16,offset,true); eo.setUint16(20,0,true);
  return new Blob([...chunks,...central,new Uint8Array(eo.buffer)],{type:'application/zip'});
}

/* ================= waveform drawing ================= */
function drawPeaks(canvas,chData,opt={}){
  const dpr=window.devicePixelRatio||1;
  const w=Math.max(50,canvas.clientWidth||canvas.width), h=Math.max(40,canvas.clientHeight||canvas.height);
  if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); }
  const g=canvas.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,w,h);
  const color=opt.color||'#7d8fd6', midY=h/2;
  const n=chData.length, step=Math.max(1,Math.floor(n/w));
  for(let x=0;x<w;x++){
    let mn=1,mx=-1;
    const i0=x*step, i1=Math.min(n,i0+step);
    for(let i=i0;i<i1;i+=2){ const v=chData[i]; if(v<mn)mn=v; if(v>mx)mx=v; }
    if(i1<=i0){ const v=chData[Math.min(n-1,i0)]||0; mn=mx=v; }
    g.fillStyle=color;
    g.fillRect(x, midY-mx*midY*.92, 1, Math.max(1,(mx-mn)*midY*.92));
  }
  if(opt.mid){ g.fillStyle='rgba(148,163,255,.14)'; g.fillRect(0,midY,w,1); }
  if(typeof opt.sel0==='number'&&typeof opt.sel1==='number'&&opt.sel1>opt.sel0){
    const x0=opt.sel0*w, x1=opt.sel1*w;
    g.fillStyle='rgba(8,13,36,.74)'; g.fillRect(0,0,x0,h); g.fillRect(x1,0,w-x1,h);
    g.strokeStyle='#38bdf8'; g.lineWidth=2; g.strokeRect(x0+1,1,x1-x0-2,h-2);
    g.fillStyle='#38bdf8';
    rr(g,x0-3,h/2-14,6,28,3); g.fill();
    rr(g,x1-3,h/2-14,6,28,3); g.fill();
  }
}

/* ================= dropzone ================= */
function attachDrop(zone,onFiles,accept){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept=accept||'audio/*'; inp.multiple=true; inp.style.display='none';
  zone.appendChild(inp);
  zone.addEventListener('click',()=>inp.click());
  inp.addEventListener('change',()=>{ if(inp.files.length) onFiles(Array.from(inp.files)); inp.value=''; });
  ['dragenter','dragover'].forEach(ev=>zone.addEventListener(ev,e=>{e.preventDefault();zone.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>zone.addEventListener(ev,e=>{e.preventDefault();zone.classList.remove('over');}));
  zone.addEventListener('drop',e=>{ const fs=Array.from(e.dataTransfer.files||[]); if(fs.length) onFiles(fs); });
  return inp;
}

  $$('[data-ex]',root).forEach(b=>{
    b.onclick=async()=>{
      b.disabled=true;
      try{ const buf=getter(); if(!buf) return toast('Nothing to export'); exportBuffer(buf,b.dataset.ex||baseNameOverride,b.dataset.fmt); }
      finally{ b.disabled=false; }
    };
  });
}
/* simple one-at-a-time preview player */
let _tp={src:null,onEnd:null};
function stopToolPlayer(){ if(_tp.src){ try{_tp.src.stop();}catch(e){} _tp.src=null; } _tp.onEnd=null; window.__pageRedraw=null; }
function playBuf(buf,btn,cb){
  if(_tp.src){
    try{_tp.src.stop();}catch(e){}
    _tp.src=null; if(btn) btn.innerHTML=IC.play+' Preview'; if(cb) cb(false);
    return;
  }
  const c=AC();
  const s=c.createBufferSource(); s.buffer=buf;
  const g=c.createGain(); g.gain.value=.95; s.connect(g); g.connect(c.destination);
  s.start();
  s.onended=()=>{ _tp.src=null; if(btn) btn.innerHTML=IC.play+' Preview'; if(cb) cb(false); };
  _tp={src:s,onEnd:s.onended};
  if(btn) btn.innerHTML=IC.pause+' Stop';
  if(cb) cb(true);
}

/* progress bar helper */
async function withProgress(elId,fn){
  const el=$(elId); if(el) el.style.width='3%';
  const wrap=el?el.parentElement:null;
  if(wrap) wrap.style.visibility='visible';
}
