<script>
'use strict';
/* ================= TRIM ================= */
function renderTrim(){
  const S={buf:null,name:'',a:0,b:0,mode:null,off:0,a0:0,b0:0};
  page.innerHTML=toolPage('Trim','Cut out the exact part you need. Drag the blue handles to set start and end, preview, then export.',
   `<div class="panel">${dropHtml('Tap to choose an audio file','or drag & drop here')}</div>
    <div class="panel mt" id="work" hidden>
      <div class="row between">
        <div class="file-row" style="flex:1;min-width:230px;border:0;padding:0;gap:10px"><div class="file-ic">${IC.music}</div><div class="file-meta"><div class="fm-n"><span id="fn"></span></div><div class="fm-s"><span id="fs"></span></div></div></div>
        <button class="btn ghost small" id="chg">Change file</button>
      </div>
      <div class="wave-wrap mt"><canvas id="wc"></canvas></div>
      <div class="row between mt">
        <span class="chip" id="ta">Start 00:00</span>
        <span class="chip" id="tlen">Length 00:00</span>
        <span class="chip" id="tb">End 00:00</span>
      </div>
      <div class="row mt">
        <button class="btn ghost" id="pp">${IC.play} Preview</button>
        <div class="spacer"></div>
        <button class="btn ghost" id="exW">${IC.download} WAV</button>
        <button class="btn primary" id="exM">${IC.download} MP3</button>
      </div>
    </div>`);
  const work=$('#work'), cv=$('#wc');
  function draw(){
    if(!S.buf) return;
    const dur=S.buf.duration;
    drawPeaks(cv,S.buf.getChannelData(0),{sel0:S.a/dur,sel1:S.b/dur,mid:true});
    $('#ta').textContent='Start '+fmtTime(S.a);
    $('#tb').textContent='End '+fmtTime(S.b);
    $('#tlen').textContent='Length '+fmtTime(S.b-S.a);
  }
  async function load(f){
    try{
      const buf=await decodeFile(f);
      S.buf=buf; S.name=f.name; S.a=0; S.b=buf.duration;
      $('#fn').textContent=f.name;
      $('#fs').textContent=fmtTime(buf.duration)+' · '+(buf.numberOfChannels>1?'stereo':'mono')+' · '+(buf.sampleRate/1000)+' kHz';
      work.hidden=false;
      requestAnimationFrame(draw);
    }catch(e){ toast("Couldn't decode "+f.name); }
  }
  attachDrop($('#dz'),fs=>load(fs[0]));
  $('#chg').onclick=()=>{ const i=$('#dz input'); if(i) i.click(); };
  cv.addEventListener('pointerdown',e=>{
    if(!S.buf) return;
    const r=cv.getBoundingClientRect(), f=(e.clientX-r.left)/r.width;
    const fa=S.a/S.buf.duration, fb=S.b/S.buf.duration;
    if(Math.abs(f-fa)<.02) S.mode='a';
    else if(Math.abs(f-fb)<.02) S.mode='b';
    else if(f>fa&&f<fb) S.mode='move';
    else return;
    S.off=f; S.a0=S.a; S.b0=S.b;
    try{cv.setPointerCapture(e.pointerId);}catch(err){}
    e.preventDefault();
  });
  cv.addEventListener('pointermove',e=>{
    if(!S.buf) return;
    const r=cv.getBoundingClientRect(), f=clamp((e.clientX-r.left)/r.width,0,1);
    if(!S.mode){
      const fa=S.a/S.buf.duration, fb=S.b/S.buf.duration;
      cv.style.cursor=(Math.abs(f-fa)<.02||Math.abs(f-fb)<.02)?'ew-resize':(f>fa&&f<fb?'grab':'crosshair');
      return;
    }
    const t=f*S.buf.duration, min=.1;
    if(S.mode==='a') S.a=clamp(t,0,S.b-min);
    else if(S.mode==='b') S.b=clamp(t,S.a+min,S.buf.duration);
    else{
      const d=(f-S.off)*S.buf.duration;
      let na=S.a0+d, nb=S.b0+d;
      if(na<0){ nb-=na; na=0; }
      if(nb>S.buf.duration){ na-=(nb-S.buf.duration); nb=S.buf.duration; }
      S.a=Math.max(0,na); S.b=Math.min(S.buf.duration,nb);
    }
    draw();
  });
  ['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>{ S.mode=null; }));
  $('#pp').onclick=()=>{ if(S.buf) playBuf(sliceBuf(S.buf,S.a,S.b),$('#pp')); };
  $('#exW').onclick=()=>{ if(S.buf) exportBuffer(sliceBuf(S.buf,S.a,S.b),safeName(S.name)+'-trim','wav'); };
  $('#exM').onclick=()=>{ if(S.buf) exportBuffer(sliceBuf(S.buf,S.a,S.b),safeName(S.name)+'-trim','mp3'); };
  window.__pageRedraw=()=>requestAnimationFrame(draw);
}

/* ================= MERGE ================= */
function renderMerge(){
  const S={items:[]};
  page.innerHTML=toolPage('Merge','Join audio files one after another into a single track. Reorder the list before exporting.',
   `<div class="panel">${dropHtml('Tap to add audio files','multiple files supported · drag & drop welcome')}</div>
    <div class="panel mt" id="listP" hidden>
      <div id="list"></div>
      <div class="row between mt">
        <span class="chip" id="tot">0 files</span>
        <div class="row">
          <button class="btn ghost small" id="clear">Clear all</button>
          <button class="btn ghost" id="exW">${IC.download} WAV</button>
          <button class="btn primary" id="exM">${IC.download} MP3</button>
        </div>
      </div>
    </div>`);
  function renderList(){
    const l=$('#list');
    l.innerHTML=S.items.map((it,i)=>`
      <div class="file-row">
        ${fileRowHtml('file',esc(it.name),fmtTime(it.buf.duration)+' · '+(it.buf.numberOfChannels>1?'stereo':'mono'))}
        <button class="icon-sq" data-mv="${i}" data-d="-1" ${i===0?'disabled':''} aria-label="Move up">${IC.up}</button>
        <button class="icon-sq" data-mv="${i}" data-d="1" ${i===S.items.length-1?'disabled':''} aria-label="Move down">${IC.down}</button>
        <button class="icon-sq danger" data-rm="${i}" aria-label="Remove">${IC.trash}</button>
      </div>`).join('');
    const dur=S.items.reduce((a,b)=>a+b.buf.duration,0);
    $('#tot').textContent=S.items.length+' file'+(S.items.length===1?'':'s')+' · '+fmtTime(dur);
    $('#listP').hidden=!S.items.length;
    $$('[data-mv]',l).forEach(b=>b.onclick=()=>{
      const i=+b.dataset.mv, j=i+(+b.dataset.d);
      const it=S.items.splice(i,1)[0]; S.items.splice(j,0,it); renderList();
    });
    $$('[data-rm]',l).forEach(b=>b.onclick=()=>{ S.items.splice(+b.dataset.rm,1); renderList(); });
  }
  async function load(files){
    for(const f of files){
      try{ const buf=await decodeFile(f); S.items.push({name:f.name,buf}); }
      catch(e){ toast("Couldn't decode "+f.name); }
    }
    renderList();
  }
  attachDrop($('#dz'),fs=>load(fs));
  $('#clear').onclick=()=>{ S.items=[]; renderList(); };
  function concat(){
    if(!S.items.length) return null;
    const c=AC();
    let total=0; S.items.forEach(it=>total+=it.buf.length);
    const nc=Math.max(...S.items.map(it=>it.buf.numberOfChannels));
    const out=c.createBuffer(nc,total,c.sampleRate);
    let pos=0;
    S.items.forEach(it=>{
      const b=it.buf;
      for(let ch=0;ch<nc;ch++){
        if(ch<b.numberOfChannels) out.getChannelData(ch).set(b.getChannelData(ch),pos);
      }
      pos+=b.length;
    });
    return out;
  }
  $('#exW').onclick=()=>{ const b=concat(); if(b) exportBuffer(b,'merged-audio','wav'); else toast('Add files first'); };
  $('#exM').onclick=()=>{ const b=concat(); if(b) exportBuffer(b,'merged-audio','mp3'); else toast('Add files first'); };
  renderList();
}

/* ================= MIX ================= */
function renderMix(){
  const S={A:null,B:null};
  function slotHtml(key,ph){
    return `<div class="panel mt" id="slot${key}" hidden>
      <div class="file-row">
        <div class="file-ic">${IC.music}</div><div class="file-meta"><div class="fm-n"><span id="n${key}"></span></div><div class="fm-s"><span id="s${key}"></span></div></div>
        <button class="icon-sq danger" id="rm${key}" aria-label="Remove">${IC.trash}</button>
      </div>
      <div class="wave-wrap sm mt"><canvas id="wv${key}"></canvas></div>
      <div class="row mt" style="gap:16px">
        <div style="flex:1"><label class="lbl">Level <span id="lv${key}" style="color:var(--cyan)">100%</span></label>
          <input type="range" class="slider" id="gs${key}" min="0" max="200" value="100"></div>
      </div>
    </div>
    <div class="panel mt" id="drop${key}">${dropHtml(ph,'track '+key+' — e.g. music or voice')}</div>`;
  }
  page.innerHTML=toolPage('Mix','Blend two audio tracks together. Set each level, preview the result, export the mix.',
   slotHtml('A','Track A — e.g. music')+slotHtml('B','Track B — e.g. voice')+
   `<div class="panel mt" id="mixP" hidden>
      <div class="row between"><label class="lbl" style="margin:0">Mixed result</label><span class="chip" id="mdur"></span></div>
      <div class="wave-wrap sm mt"><canvas id="wmix"></canvas></div>
      <div class="row mt">
        <button class="btn ghost" id="pp">${IC.play} Preview</button>
        <div class="spacer"></div>
        <button class="btn ghost" id="exW">${IC.download} WAV</button>
        <button class="btn primary" id="exM">${IC.download} MP3</button>
      </div>
    </div>`);
  ['A','B'].forEach(k=>{
    attachDrop($('#drop'+k),async fs=>{
      const f=fs[0];
      try{
        const buf=await decodeFile(f);
        S[k]={name:f.name,buf,gain:1};
        $('#drop'+k).style.display='none';
        $('#slot'+k).hidden=false;
        $('#n'+k).textContent=f.name;
        $('#s'+k).textContent=fmtTime(buf.duration)+' · '+(buf.numberOfChannels>1?'stereo':'mono');
        drawSlot(k); mixDraw();
      }catch(e){ toast("Couldn't decode "+f.name); }
    });
    $('#rm'+k).onclick=()=>{ S[k]=null; $('#slot'+k).hidden=true; $('#drop'+k).style.display=''; mixDraw(); };
    $('#gs'+k).oninput=e=>{ if(!S[k]) return; S[k].gain=+e.target.value/100; $('#lv'+k).textContent=e.target.value+'%'; mixDraw(); };
  });
  function drawSlot(k){
    const it=S[k]; if(!it) return;
    drawPeaks($('#wv'+k),it.buf.getChannelData(0),{color:k==='A'?'#e879f9':'#22d3ee'});
  }
  function mixData(){
    if(!(S.A&&S.B)) return null;
    const c=AC();
    const total=Math.max(S.A.buf.length,S.B.buf.length);
    const L=new Float32Array(total), R=new Float32Array(total);
    [S.A,S.B].forEach(it=>{
      const d0=it.buf.getChannelData(0), d1=it.buf.numberOfChannels>1?it.buf.getChannelData(1):d0;
      for(let i=0;i<d0.length;i++){ L[i]+=d0[i]*it.gain; R[i]+=d1[i]*it.gain; }
    });
    return {L,R,total};
  }
  function mixDraw(){
    const m=mixData();
    $('#mixP').hidden=!m;
    if(!m) return;
    $('#mdur').textContent=fmtTime(m.total/AC().sampleRate);
    drawPeaks($('#wmix'),m.L,{color:'#818cf8'});
  }
  function mixBuf(){
    const m=mixData(); if(!m) return null;
    const out=AC().createBuffer(2,m.total,AC().sampleRate);
    out.getChannelData(0).set(m.L); out.getChannelData(1).set(m.R);
    return out;
  }
  $('#pp').onclick=()=>{ const b=mixBuf(); if(b) playBuf(b,$('#pp')); };
  $('#exW').onclick=()=>{ const b=mixBuf(); if(b) exportBuffer(b,'mixed-audio','wav'); };
  $('#exM').onclick=()=>{ const b=mixBuf(); if(b) exportBuffer(b,'mixed-audio','mp3'); };
  window.__pageRedraw=()=>{ if(S.A)drawSlot('A'); if(S.B)drawSlot('B'); mixDraw(); };
}

function renderSplit(){
  const S={buf:null,name:'',pts:[]};
  page.innerHTML=toolPage('Split','Slice one file into segments. Tap the waveform to add a cut point (tap a marker to remove it), then download the pieces.',
   `<div class="panel">${dropHtml('Tap to choose an audio file','or drag & drop here')}</div>
    <div class="panel mt" id="work" hidden>
      <div class="row between">
        <div class="file-row" style="flex:1;min-width:230px;border:0;padding:0;gap:10px"><div class="file-ic">${IC.music}</div><div class="file-meta"><div class="fm-n"><span id="fn"></span></div><div class="fm-s"><span id="fs"></span></div></div></div>
        <button class="btn ghost small" id="chg">Change file</button>
      </div>
      <div class="wave-wrap mt"><canvas id="wc"></canvas></div>
      <p class="dim mt" style="font-size:12.5px">Tap the waveform to add cut points · tap an existing marker to remove it.</p>
      <div id="segs" class="mt"></div>
      <div class="row mt" style="justify-content:flex-end">
        <button class="btn primary" id="exAll">${IC.download} Download all (WAV)</button>
      </div>
    </div>`);
  const cv=$('#wc');
  function segs(){
    const dur=S.buf.duration, pts=S.pts.slice().sort((a,b)=>a-b);
    const out=[], bounds=[0,...pts,dur];
    for(let i=0;i<bounds.length-1;i++){ const a=bounds[i], b=bounds[i+1]; if(b-a>0.05) out.push({a,b}); }
    return out;
  }
  function renderSegs(){
    const ss=segs();
    $('#segs').innerHTML=ss.map((s,i)=>`
      <div class="file-row">
        ${fileRowHtml('file','Segment '+(i+1),fmtTime(s.a)+' → '+fmtTime(s.b)+' · '+fmtTime(s.b-s.a))}
        <button class="btn ghost small" data-sw="${i}">WAV</button>
        <button class="btn primary small" data-sm="${i}">MP3</button>
      </div>`).join('');
    $$('[data-sw]').forEach(b=>b.onclick=()=>{ const s=segs()[+b.dataset.sw]; exportBuffer(sliceBuf(S.buf,s.a,s.b),'segment-'+(+b.dataset.sw+1),'wav'); });
    $$('[data-sm]').forEach(b=>b.onclick=()=>{ const s=segs()[+b.dataset.sm]; exportBuffer(sliceBuf(S.buf,s.a,s.b),'segment-'+(+b.dataset.sm+1),'mp3'); });
  }
  function draw(){
    if(!S.buf) return;
    const r=cv.getBoundingClientRect();
    drawPeaks(cv,S.buf.getChannelData(0),{mid:true});
    const g=cv.getContext('2d'), dpr=window.devicePixelRatio||1, h=cv.clientHeight;
    g.setTransform(dpr,0,0,dpr,0,0);
    S.pts.forEach((p,i)=>{
      const x=p/S.buf.duration*r.width;
      g.strokeStyle='#f472b6'; g.lineWidth=2;
      g.beginPath(); g.moveTo(x,0); g.lineTo(x,h); g.stroke();
      g.fillStyle='#f472b6'; rr(g,x-11,6,22,18,5); g.fill();
      g.fillStyle='#3b0a1e'; g.font='800 11px system-ui, sans-serif'; g.textBaseline='middle';
      g.fillText(String(i+1),x,15.5);
    });
    renderSegs();
  }
  cv.addEventListener('click',e=>{
    if(!S.buf) return;
    const r=cv.getBoundingClientRect();
    const f=clamp((e.clientX-r.left)/r.width,0,1), t=f*S.buf.duration;
    let best=-1, bd=9;
    S.pts.forEach((p,i)=>{ const d=Math.abs(p/S.buf.duration*r.width-(e.clientX-r.left)); if(d<bd){ bd=d; best=i; } });
    if(best>=0) S.pts.splice(best,1);
    else S.pts.push(t);
    draw();
  });
  async function load(f){
    try{
      const buf=await decodeFile(f);
      S.buf=buf; S.name=f.name; S.pts=[];
      $('#fn').textContent=f.name;
      $('#fs').textContent=fmtTime(buf.duration);
      $('#work').hidden=false;
      requestAnimationFrame(draw);
    }catch(e){ toast("Couldn't decode "+f.name); }
  }
  attachDrop($('#dz'),fs=>load(fs[0]));
  $('#chg').onclick=()=>{ const i=$('#dz input'); if(i) i.click(); };
  $('#exAll').onclick=async()=>{
    const ss=segs();
    for(let i=0;i<ss.length;i++){
      exportBuffer(sliceBuf(S.buf,ss[i].a,ss[i].b),'segment-'+(i+1),'wav');
      await sleep(400);
    }
  };
  window.__pageRedraw=draw;
}

/* ================= INSERT (splice) ================= */
function renderInsert(){
  const S={base:null,ins:null,pos:0,xf:true};
  const dz=(id,main,sub)=>`<div class="drop" id="${id}">${IC.upload}<div class="d-main">${main}</div><div class="d-sub">${sub}</div></div>`;
  page.innerHTML=toolPage('Insert','Splice one audio file into another at any position — with an optional crossfade at the join.',
   `<div class="panel">${dz('dzb','Base audio — the file you\'ll cut open','mp3, wav, m4a, ogg…')}</div>
    <div class="panel mt">${dz('dzi','Insert audio — the file to splice in','mp3, wav, m4a, ogg…')}</div>
    <div class="panel mt" id="work" hidden>
      <div class="file-row"><div class="file-ic">${IC.file}</div><div class="file-meta"><div class="fm-n"><span id="bn"></span></div><div class="fm-s"><span id="bs"></span></div></div></div>
      <div class="file-row mt"><div class="file-ic">${IC.file}</div><div class="file-meta"><div class="fm-n"><span id="inn"></span></div><div class="fm-s"><span id="ins2"></span></div></div></div>
      <div class="row mt" style="gap:16px">
        <div style="flex:1;min-width:200px"><label class="lbl">Insert position <span id="pv" style="color:var(--cyan)">00:00</span></label>
          <input type="range" class="slider" id="pos" min="0" max="1000" value="0"></div>
        <span class="chip on" id="xfChip">${IC.check} 0.2s crossfade</span>
      </div>
      <div class="row mt">
        <button class="btn ghost" id="pp">${IC.play} Preview</button>
        <div class="spacer"></div>
        <button class="btn ghost" id="exW">${IC.download} WAV</button>
        <button class="btn primary" id="exM">${IC.download} MP3</button>
      </div>
    </div>`);
  async function loadOne(which,f){
    try{
      const buf=await decodeFile(f);
      if(which==='base'){ S.base={name:f.name,buf}; S.pos=0; } else S.ins={name:f.name,buf};
      refresh();
    }catch(e){ toast("Couldn't decode "+f.name); }
  }
  attachDrop($('#dzb'),fs=>loadOne('base',fs[0]));
  attachDrop($('#dzi'),fs=>loadOne('ins',fs[0]));
  function refresh(){
    const work=$('#work');
    work.hidden=!(S.base&&S.ins);
    if(!S.base||!S.ins) return;
    $('#bn').textContent='Base: '+S.base.name;
    $('#bs').textContent=fmtTime(S.base.buf.duration)+' · '+(S.base.buf.numberOfChannels>1?'stereo':'mono');
    $('#inn').textContent='Insert: '+S.ins.name;
    $('#ins2').textContent=fmtTime(S.ins.buf.duration);
    const pos=$('#pos');
    pos.max=Math.floor(S.base.buf.duration*1000);
    pos.value=Math.floor(S.pos*1000);
    $('#pv').textContent=fmtTime(S.pos);
  }
  $('#pos').oninput=e=>{ S.pos=+e.target.value/1000; $('#pv').textContent=fmtTime(S.pos); };
  $('#xfChip').onclick=()=>{ S.xf=!S.xf; $('#xfChip').classList.toggle('on',S.xf); };
  function splice(){
    const b=S.base.buf, i=S.ins.buf, c=AC();
    const p0=Math.floor(clamp(S.pos,0,b.duration)*c.sampleRate);
    const cut=S.xf?Math.min(p0,Math.floor(.2*c.sampleRate)):0;
    const total=Math.max(1,(p0-cut)+cut+(i.length-cut)+(b.length-p0));
    const out=c.createBuffer(2,total,c.sampleRate);
    const L=out.getChannelData(0), R=out.getChannelData(1);
    const b0=b.getChannelData(0), b1=b.numberOfChannels>1?b.getChannelData(1):b0;
    const i0=i.getChannelData(0), i1=i.numberOfChannels>1?i.getChannelData(1):i0;
    const copy=(dst,src,from,len)=>{ for(let j=0;j<len;j++) dst[from+j]=src[j]; };
    const n1=p0-cut;
    for(let ch=0;ch<2;ch++){ const src=ch?b1:b0, dst=ch?R:L; copy(dst,src,0,n1); }
    for(let j=0;j<cut;j++){
      const t=cut>0?j/cut:1;
      L[n1+j]=b0[p0-cut+j]*(1-t)+i0[j]*t;
      R[n1+j]=b1[p0-cut+j]*(1-t)+i1[j]*t;
    }
    const n3=i.length-cut, o2=n1+cut;
    for(let ch=0;ch<2;ch++){ const src=ch?i1:i0, dst=ch?R:L; copy(dst,src,cut,n3); }
    const n4=b.length-p0, o3=o2+n3;
    for(let ch=0;ch<2;ch++){ const src=ch?b1:b0, dst=ch?R:L; copy(dst,src,p0,n4); }
    return out;
  }
  $('#pp').onclick=()=>{ if(S.base&&S.ins) playBuf(splice(),$('#pp')); };
  $('#exW').onclick=()=>{ if(S.base&&S.ins) exportBuffer(splice(),'inserted-audio','wav'); };
  $('#exM').onclick=()=>{ if(S.base&&S.ins) exportBuffer(splice(),'inserted-audio','mp3'); };
}

  }
  async function process(){
    if(!S.buf) return;
    const buf=S.buf, g=Math.pow(10,S.db/20);
    const out=AC().createBuffer(buf.numberOfChannels,buf.length,buf.sampleRate);
    const tanhG=Math.tanh(g);
    for(let ch=0;ch<buf.numberOfChannels;ch++){
      const d=buf.getChannelData(ch), o=out.getChannelData(ch);
      for(let i=0;i<d.length;i++){
        const x=d[i]*g;

      await sleep(0);
    }
    S.proc=out; draw();

      const buf=await decodeFile(f);
      S.buf=buf; S.name=f.name; S.proc=null;
      $('#fn').textContent=f.name;
      $('#fs').textContent=fmtTime(buf.duration);
      $('#work').hidden=false;
      await sleep(30); draw(); await process();
    }catch(e){ toast("Couldn't decode "+f.name); }
  }

  $('#chg').onclick=()=>{ const i=$('#dz input'); if(i) i.click(); };
  $('#db').oninput=async e=>{ S.db=+e.target.value; $('#dbv').textContent=(S.db>=0?'+':'')+S.db.toFixed(1)+' dB'; await process(); };
  $('#softChip').onclick=async()=>{ S.soft=!S.soft; $('#softChip').classList.toggle('on',S.soft); await process(); };
  $('#pp').onclick=()=>{ if(S.proc) playBuf(S.proc,$('#pp')); };

  $('#exM').onclick=()=>{ if(S.proc) exportBuffer(S.proc,safeName(S.name)+'-boosted','mp3'); };

}

/* ================= MP3 TO VIDEO ================= */
function renderA2V(){
  const S={buf:null,name:'',active:false};
  page.innerHTML=toolPage('MP3 to Video','Turn audio into an animated video — a 720p visualizer with bars synced to your sound. Rendered locally in real time.',
   `<div class="panel">${dropHtml('Tap to choose an audio file','mp3, wav, m4a, ogg…')}</div>
    <div class="panel mt" id="work" hidden>
      <div class="row between">
        <div class="file-row" style="flex:1;min-width:230px;border:0;padding:0;gap:10px"><div class="file-ic">${IC.music}</div><div class="file-meta"><div class="fm-n"><span id="fn"></span></div><div class="fm-s"><span id="fs"></span></div></div></div>
        <button class="btn ghost small" id="chg">Change file</button>
      </div>
      <div class="av-wrap mt" id="avPanel" hidden><canvas id="avCanvas" width="1280" height="720"></canvas></div>
      <div class="mt" id="avProgWrap" style="visibility:hidden"><div class="prog"><div id="avProg"></div></div></div>
      <div class="row mt">
        <button class="btn primary" id="avBtn">${IC.video} Generate video</button>
        <span class="muted" style="font-size:13px" id="avHint">Rendering takes as long as the audio (kept in sync, so keep this tab visible).</span>
      </div>
    </div>`);
  let rec=null;
  async function load(f){
    try{
      const buf=await decodeFile(f);
      S.buf=buf; S.name=f.name;
      $('#fn').textContent=f.name;
      $('#fs').textContent=fmtTime(buf.duration);
      $('#work').hidden=false;
    }catch(e){ toast("Couldn't decode "+f.name); }
  }
  attachDrop($('#dz'),fs=>load(fs[0]));
  $('#chg').onclick=()=>{ const i=$('#dz input'); if(i) i.click(); };
  $('#avBtn').onclick=async()=>{
    if(!S.buf||S.active) return;
    S.active=true;
    const btn=$('#avBtn'); btn.disabled=true; btn.innerHTML=IC.clock+' Rendering…';
    $('#avPanel').hidden=false;
    $('#avProgWrap').style.visibility='visible';
    const c=AC(); await c.resume();
    const cv=$('#avCanvas'); cv.width=1280; cv.height=720;
    const g=cv.getContext('2d');
    const stream=cv.captureStream(30);
    const dst=c.createMediaStreamDestination();
    const src=c.createBufferSource(); src.buffer=S.buf;
    const an=c.createAnalyser(); an.fftSize=256; an.smoothingTimeConstant=.82;
    src.connect(an); an.connect(dst); an.connect(c.destination);
    stream.addTrack(dst.stream.getAudioTracks()[0]);
    let mime='video/webm';
    if(window.MediaRecorder) for(const t of ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm']){
      if(MediaRecorder.isTypeSupported(t)){ mime=t; break; }
    }
    if(!window.MediaRecorder){ toast('Video recording not supported in this browser'); S.active=false; btn.disabled=false; btn.innerHTML=IC.video+' Generate video'; return; }
    const chunks=[];
    rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:4000000});
    rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
    const done=new Promise(res=>rec.onstop=res);
    rec.start(250);
    const t0=c.currentTime; src.start(t0);
    const freq=new Uint8Array(an.frequencyBinCount);
    let finished=false;
    const finish=()=>{
      if(finished) return; finished=true;
      S.active=false;
      try{src.stop();}catch(e){}
      try{an.disconnect();}catch(e){}
      if(rec&&rec.state!=='inactive') rec.stop();
      done.then(()=>{
        const blob=new Blob(chunks,{type:'video/webm'});
        btn.disabled=false; btn.innerHTML=IC.video+' Generate video';
        if(blob.size>1000) downloadBlob(blob,safeName(S.name)+'-visual.webm');
        else toast('Could not record video');
      });
    };
    const draw=()=>{
      if(!S.active) return;
      an.getByteFrequencyData(freq);
      const bg=g.createLinearGradient(0,0,0,720);
      bg.addColorStop(0,'#0b1233'); bg.addColorStop(1,'#070c22');
      g.fillStyle=bg; g.fillRect(0,0,1280,720);
      const n=48, bw=1280/n;
      for(let i=0;i<n;i++){
        const v=freq[Math.floor(i/n*freq.length*.72)]/255;
        const bh=Math.max(10,v*460);
        g.fillStyle=`hsla(${195+i/n*110},85%,60%,.92)`;
        rr(g,i*bw+6,640-bh,bw-12,bh,8); g.fill();
      }

      g.fillText(fmtTime(t)+' / '+fmtTime(S.buf.duration),60,700);

      $('#avProg').style.width=(clamp(t/S.buf.duration,0,1)*100)+'%';
      if(t>=S.buf.duration){ finish(); return; }

}

/* ================= NOISE REMOVER ================= */
function hann(n){ const w=new Float32Array(n); for(let i=0;i<n;i++) w[i]=.5-.5*Math.cos(2*Math.PI*i/(n-1)); return w; }
function fft(re,im){
  const n=re.length;
  for(let i=1,j=0;i<n;i++){
    let bit=n>>1;
    for(;j&bit;bit>>=1) j^=bit;
    j^=bit;
    if(i<j){ let t=re[i]; re[i]=re[j]; re[j]=t; t=im[i]; im[i]=im[j]; im[j]=t; }
  }
  for(let len=2;len<=n;len<<=1){
    const ang=-2*Math.PI/len, wr=Math.cos(ang), wi=Math.sin(ang);
    for(let i=0;i<n;i+=len){
      let cr=1,ci=0;
      for(let j=0;j<len>>1;j++){
        const a=i+j, b=a+(len>>1);
        const vr=re[b]*cr-im[b]*ci, vi=re[b]*ci+im[b]*cr;
        re[b]=re[a]-vr; im[b]=im[a]-vi;
        re[a]+=vr; im[a]+=vi;
        const nr=cr*wr-ci*wi; ci=cr*wi+ci*wr; cr=nr;
      }
    }
  }
}
function ifft(re,im){
  const n=re.length;
  for(let i=0;i<n;i++) im[i]=-im[i];
  fft(re,im);
  for(let i=0;i<n;i++){ re[i]/=n; im[i]=-im[i]/n; }
}
async function denoiseBuffer(buf,strength,onProg){
  const sr=buf.sampleRate, nc=buf.numberOfChannels;
  const frame=2048, hop=512, half=frame/2;
  const win=hann(frame);
  const nFrames=Math.max(1,Math.floor((buf.length-frame)/hop)+1);
  const noise=new Float32Array(half+1);
  const re0=new Float32Array(frame), im0=new Float32Array(frame);
  let pf=0;
  const maxPf=Math.max(1,Math.floor(.5*sr/hop));
  for(let f=0;f<maxPf&&f<nFrames;f++){
    const pos=f*hop;
    for(let c=0;c<nc;c++){
      const d=buf.getChannelData(c);
      re0.fill(0);
      for(let i=0;i<frame;i++) re0[i]=d[pos+i]*win[i];
      fft(re0,im0);
      for(let k=0;k<=half;k++) noise[k]+=Math.hypot(re0[k],im0[k]);
    }
    pf++;
  }
  const norm=Math.max(1,pf*nc);
  for(let k=0;k<=half;k++) noise[k]/=norm;
  const outLen=buf.length+frame;
  const sums=[], wsums=[];
  for(let c=0;c<nc;c++){ sums.push(new Float32Array(outLen)); wsums.push(new Float32Array(outLen)); }
  const re=new Float32Array(frame), im=new Float32Array(frame);
  const yieldEvery=Math.max(1,(nFrames/25)|0);
  for(let f=0;f<nFrames;f++){
    const pos=f*hop;
    for(let c=0;c<nc;c++){
      const d=buf.getChannelData(c);
      re.fill(0); im.fill(0);
      for(let i=0;i<frame;i++) re[i]=d[pos+i]*win[i];
      fft(re,im);
      for(let k=0;k<=half;k++){
        const mag=Math.hypot(re[k],im[k]);
        const nmag=mag>noise[k]*strength?mag-noise[k]*strength:noise[k]*.02;
        const s=mag>1e-9?nmag/mag:0;
        re[k]*=s; im[k]*=s;
        if(k>0&&k<half){ re[frame-k]=re[k]; im[frame-k]=-im[k]; }
      }
      ifft(re,im);
      const s32=sums[c], w32=wsums[c];
      for(let i=0;i<frame;i++){ const w2=win[i]*win[i]; s32[pos+i]+=re[i]*win[i]; w32[pos+i]+=w2; }
    }
    if(f%yieldEvery===0){ if(onProg) onProg(f/nFrames); await sleep(0); }
  }
  const out=AC().createBuffer(nc,buf.length,sr);
  for(let c=0;c<nc;c++){
    const o=out.getChannelData(c), s32=sums[c], w32=wsums[c];
    for(let i=0;i<buf.length;i++){ const w=w32[i]; o[i]=w>1e-6?s32[i]/w:0; }
  }
  if(onProg) onProg(1);
  return out;
}

/* ================= voice changer (real DSP) ================= */
function shaperCurve(k){ const n=1024,c=new Float32Array(n); for(let i=0;i<n;i++){ const x=i/(n-1)*2-1; c[i]=Math.tanh(k*x)/Math.tanh(k); } return c; }
function makeImpulse(ctx,dur,decay){
  const rate=ctx.sampleRate,len=Math.max(1,Math.ceil(rate*dur));
  const ir=ctx.createBuffer(2,len,rate);
  for(let ch=0;ch<2;ch++){ const d=ir.getChannelData(ch);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay); }
  return ir;
}
async function renderVoiceFx(buf,id){
  const rate=id==='chipmunk'?1.5:(id==='deep'?0.6:1);
  const tail=id==='echo'?1.4:(id==='reverb'?2.2:0.15);
  const sr=buf.sampleRate;
  const off=new OfflineAudioContext(2,Math.max(1,Math.ceil((buf.duration/rate+tail)*sr)),sr);
  const src=off.createBufferSource(); src.buffer=buf; src.playbackRate.value=rate;
  const done=()=>off.startRendering();
  if(id==='chipmunk'||id==='deep'){
    src.connect(off.destination); src.start(0); return done();
  }
  if(id==='robot'){
    const sh=off.createWaveShaper(); sh.curve=shaperCurve(24); sh.oversample='4x';
    const hp=off.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=140;
    const ring=off.createGain(); ring.gain.value=.5;
    const lfo=off.createOscillator(); lfo.frequency.value=32;
    const lg=off.createGain(); lg.gain.value=.5;
    lfo.connect(lg); lg.connect(ring.gain);
    src.connect(sh); sh.connect(ring); ring.connect(hp); hp.connect(off.destination);
    src.start(0); lfo.start(0); return done();
  }
  if(id==='echo'){
    const dry=off.createGain(); dry.gain.value=.85;
    const dly=off.createDelay(1); dly.delayTime.value=.28;
    const fb=off.createGain(); fb.gain.value=.42;
    const wet=off.createGain(); wet.gain.value=.65;
    src.connect(dry); dry.connect(off.destination);
    src.connect(dly); dly.connect(fb); fb.connect(dly); dly.connect(wet); wet.connect(off.destination);
    src.start(0); return done();
  }
  if(id==='reverb'){
    const conv=off.createConvolver(); conv.buffer=makeImpulse(off,2.4,2.6);
    const wet=off.createGain(); wet.gain.value=.55;
    const dry=off.createGain(); dry.gain.value=.7;
    src.connect(dry); dry.connect(off.destination);
    src.connect(conv); conv.connect(wet); wet.connect(off.destination);
    src.start(0); return done();
  }
  /* phone */
  const hp=off.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=380; hp.Q.value=.7;
  const lp=off.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=3000; lp.Q.value=.7;
  const sh=off.createWaveShaper(); sh.curve=shaperCurve(4); sh.oversample='2x';
  src.connect(hp); hp.connect(lp); lp.connect(sh); sh.connect(off.destination);
  src.start(0); return done();
}

    S.raf=requestAnimationFrame(loop);
  };

    if(S.rec&&S.rec.state==='recording') S.rec.stop();

  window.__pageStop=()=>cleanup();
}

        <button class="btn ghost" id="exW">${IC.download} WAV</button>
        <button class="btn primary" id="exM">${IC.download} MP3</button>
      </div>
    </div>`);
  const cv=$('#wc');
  function draw(color){
    if(S.proc) drawPeaks(cv,S.proc.getChannelData(0),{color:color||'#e879f9'});
    else if(S.buf) drawPeaks(cv,S.buf.getChannelData(0),{color:'#7d8fd6'});
  }
  function rms(buf){
    const d=buf.getChannelData(0); let s=0;
    for(let i=0;i<d.length;i+=4) s+=d[i]*d[i];
    return Math.sqrt(s/(d.length/4));
  }
  async function load(f){
    try{
      const buf=await decodeFile(f);
      S.buf=buf; S.name=f.name; S.proc=null;
      $('#fn').textContent=f.name;
      $('#fs').textContent=fmtTime(buf.duration);
      $('#work').hidden=false;
      $('#stats').hidden=true;
      requestAnimationFrame(()=>draw());
    }catch(e){ toast("Couldn't decode "+f.name); }
  }
  attachDrop($('#dz'),fs=>load(fs[0]));
  $('#chg').onclick=()=>{ const i=$('#dz input'); if(i) i.click(); };
  $('#th').oninput=e=>{ S.th=+e.target.value; $('#thv').textContent=S.th+' dB'; };
  $('#ra').oninput=e=>{ S.ra=+e.target.value; $('#rav').textContent=S.ra.toFixed(1).replace(/\.0$/,'')+':1'; };
  $('#kn').oninput=e=>{ S.kn=+e.target.value; $('#knv').textContent=S.kn+' dB'; };
  $('#rl').oninput=e=>{ S.rl=+e.target.value; $('#rlv').textContent=S.rl.toFixed(2)+' s'; };
  $('#at').oninput=e=>{ S.at=+e.target.value; $('#atv').textContent=S.at.toFixed(3)+' s'; };
  $('#run').onclick=async()=>{
    if(!S.buf) return;
    const btn=$('#run'); btn.disabled=true;
    try{
      toast('Compressing…',1200);
      await sleep(30);
      const off=new OfflineAudioContext(S.buf.numberOfChannels,Math.ceil(S.buf.duration*S.buf.sampleRate),S.buf.sampleRate);
      const src=off.createBufferSource(); src.buffer=S.buf;
      const comp=off.createDynamicsCompressor();
      comp.threshold.value=S.th; comp.ratio.value=S.ra; comp.knee.value=S.kn;
      comp.attack.value=S.at; comp.release.value=S.rl;
      src.connect(comp); comp.connect(off.destination);
      src.start(0);
      S.proc=await off.startRendering();
      const dIn=20*Math.log10(Math.max(1e-6,rms(S.buf)));
      const dOut=20*Math.log10(Math.max(1e-6,rms(S.proc)));
      $('#statChip').textContent='Output level '+(dOut-dIn>=0?'+':'')+(dOut-dIn).toFixed(1)+' dB vs original';
      $('#stats').hidden=false;
      requestAnimationFrame(()=>draw());
      toast('Compressed — preview or export');
    }catch(e){ console.warn(e); toast('Processing failed'); }
    btn.disabled=false;
  };
  $('#pp').onclick=()=>{ if(S.proc) playBuf(S.proc,$('#pp')); else toast('Compress first'); };
  $('#exW').onclick=()=>{ if(S.proc) exportBuffer(S.proc,safeName(S.name)+'-compressed','wav'); else toast('Compress first'); };
  $('#exM').onclick=()=>{ if(S.proc) exportBuffer(S.proc,safeName(S.name)+'-compressed','mp3'); else toast('Compress first'); };
  window.__pageRedraw=()=>draw();
}

/* ================= effects rack (12 chainable real DSP effects) ================= */
const FFX=[
  {id:'eq',      nm:'8-Band EQ',      ic:'eq',      ds:'Shape the tone'},
  {id:'bass',    nm:'Bass Boost',     ic:'volume',  ds:'Thicker low end'},
  {id:'reverb',  nm:'Reverb',         ic:'ai',      ds:'Room / hall space'},
  {id:'echo',    nm:'Echo',           ic:'clock',   ds:'Bouncing delay'},
  {id:'comp',    nm:'Compressor',     ic:'sliders', ds:'Even out dynamics'},
  {id:'limiter', nm:'Limiter',        ic:'shield',  ds:'Peak protection'},
  {id:'dist',    nm:'Distortion',     ic:'bolt',    ds:'Grit & drive'},
  {id:'chorus',  nm:'Chorus',         ic:'music',   ds:'Layered width'},
  {id:'phaser',  nm:'Phaser',         ic:'music',   ds:'Sweeping motion'},
  {id:'trem',    nm:'Tremolo',        ic:'volume',  ds:'Pulsing level'},
  {id:'widen',   nm:'Stereo Widen',   ic:'merge',   ds:'Wider image'},
  {id:'norm',    nm:'Normalize',      ic:'check',   ds:'Set loudness target'},
];
function ffxDefaults(id){
  switch(id){
    case 'eq': return {b:[0,0,0,0,0,0,0,0]};
    case 'bass': return {amt:6};
    case 'reverb': return {wet:40};
    case 'echo': return {wet:45};
    case 'comp': return {thr:-24,ratio:4};
    case 'limiter': return {thr:-6};
    case 'dist': return {drive:8};
    case 'chorus': return {depth:50};
    case 'phaser': return {rate:.6};
    case 'trem': return {rate:2.5};
    case 'widen': return {amt:100};
    case 'norm': return {tgt:-1};
  }
  return {};
}
function ffxBuild(off,id,inNode,P){
  switch(id){
    case 'eq':{
      const freqs=[60,150,400,1000,2500,6000,12000,16000];
      let node=inNode;
      freqs.forEach((f,i)=>{
        const b=off.createBiquadFilter();
        b.type=i===0?'lowshelf':(i===7?'highshelf':'peaking');
        b.frequency.value=f; b.Q.value=1; b.gain.value=P.b[i]||0;
        node.connect(b); node=b;
      });
      return node;
    }
    case 'bass':{
      const b=off.createBiquadFilter(); b.type='lowshelf'; b.frequency.value=110; b.Q.value=.8; b.gain.value=P.amt;
      inNode.connect(b); return b;
    }
    case 'reverb':{
      const conv=off.createConvolver(); conv.buffer=makeImpulse(off,2.2,2.4);
      const wet=off.createGain(); wet.gain.value=P.wet/100;
      const dry=off.createGain(); dry.gain.value=1-Math.min(.7,P.wet/100*.7);
      const out=off.createGain();
      inNode.connect(dry); dry.connect(out);
      inNode.connect(conv); conv.connect(wet); wet.connect(out);
      return out;
    }
    case 'echo':{
      const dly=off.createDelay(1); dly.delayTime.value=.3;
      const fb=off.createGain(); fb.gain.value=.4;
      const wet=off.createGain(); wet.gain.value=P.wet/100;
      const out=off.createGain();
      inNode.connect(out); inNode.connect(dly); dly.connect(fb); fb.connect(dly); dly.connect(wet); wet.connect(out);
      return out;
    }
    case 'comp':{
      const c=off.createDynamicsCompressor(); c.threshold.value=P.thr; c.ratio.value=P.ratio; c.knee.value=6;
      inNode.connect(c); return c;
    }
    case 'limiter':{
      const c=off.createDynamicsCompressor(); c.threshold.value=P.thr; c.ratio.value=20; c.knee.value=0; c.attack.value=.002; c.release.value=.08;
      inNode.connect(c); return c;
    }
    case 'dist':{
      const sh=off.createWaveShaper(); sh.curve=shaperCurve(P.drive); sh.oversample='4x';
      const lp=off.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=5200;
      const pre=off.createGain(); pre.gain.value=Math.min(1,5/Math.max(2,P.drive));
      inNode.connect(sh); sh.connect(lp); lp.connect(pre); return pre;
    }
    case 'chorus':{
      const dly=off.createDelay(.05); dly.delayTime.value=.022;
      const lfo=off.createOscillator(); lfo.frequency.value=.6;
      const lg=off.createGain(); lg.gain.value=.011*(P.depth/100+.2);
      lfo.connect(lg); lg.connect(dly.delayTime);
      const wet=off.createGain(); wet.gain.value=.55;
      const out=off.createGain();
      inNode.connect(out); inNode.connect(dly); dly.connect(wet); wet.connect(out);
      lfo.start(0); return out;
    }
    case 'phaser':{
      const bp=off.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=900; bp.Q.value=5;
      const lfo=off.createOscillator(); lfo.frequency.value=P.rate;
      const lg=off.createGain(); lg.gain.value=650;
      lfo.connect(lg); lg.connect(bp.frequency);
      const wet=off.createGain(); wet.gain.value=.5;
      const out=off.createGain();
      inNode.connect(out); inNode.connect(bp); bp.connect(wet); wet.connect(out);
      lfo.start(0); return out;
    }
    case 'trem':{
      const g=off.createGain(); g.gain.value=.75;
      const lfo=off.createOscillator(); lfo.frequency.value=P.rate;
      const lg=off.createGain(); lg.gain.value=.25;
      lfo.connect(lg); lg.connect(g.gain);
      inNode.connect(g); lfo.start(0); return g;
    }
    case 'widen':{
      const amt=P.amt/100;
      const split=off.createChannelSplitter(2);
      const Lg=off.createGain(); Lg.gain.value=.5;
      const Rg=off.createGain(); Rg.gain.value=.5;
      const Lsn=off.createGain(); Lsn.gain.value=-.5;
      const Rsn=off.createGain(); Rsn.gain.value=.5;
      const mid=off.createGain(); const side=off.createGain();
      const midL=off.createGain(); midL.gain.value=1;
      const sideL=off.createGain(); sideL.gain.value=amt;
      const midR=off.createGain(); midR.gain.value=1;
      const sideR=off.createGain(); sideR.gain.value=-amt;
      const mer=off.createChannelMerger(2);
      inNode.connect(split);
      split.connect(Lg,0); Lg.connect(mid,0);
      split.connect(Rg,1); Rg.connect(mid,0);
      split.connect(Lsn,0); Lsn.connect(side,0);
      split.connect(Rsn,1); Rsn.connect(side,0);
      mid.connect(midL); midL.connect(mer,0);
      side.connect(sideL); sideL.connect(mer,0);
      mid.connect(midR); midR.connect(mer,1);
      side.connect(sideR); sideR.connect(mer,1);
      return mer;
    }
  }
  return inNode;
}
function bufPeak(buf){
  let m=0;
  for(let c=0;c<buf.numberOfChannels;c++){
    const d=buf.getChannelData(c);
    for(let i=0;i<d.length;i+=4){ const v=Math.abs(d[i]); if(v>m)m=v; }
  }
  return m;
}
function upmixStereo(buf){
  const out=AC().createBuffer(2,buf.length,buf.sampleRate);
  const d=buf.getChannelData(0);
  for(let c=0;c<2;c++) out.getChannelData(c).set(d);
  return out;
}
async function renderFxChain(buf,chain){
  const active=chain.filter(f=>f.on);
  const base=active.filter(f=>f.id!=='norm');
  const nf=active.find(f=>f.id==='norm');
  let src=buf, tail=.1;
  if(base.some(f=>f.id==='reverb')) tail=2.3;
  if(base.some(f=>f.id==='echo')) tail=Math.max(tail,1.3);
  if(base.some(f=>f.id==='widen')&&buf.numberOfChannels<2) src=upmixStereo(buf);
  const sr=src.sampleRate;
  const off=new OfflineAudioContext(2,Math.ceil((src.duration+tail)*sr),sr);
  const s=off.createBufferSource(); s.buffer=src;
  let node=s;
  for(const f of base) node=ffxBuild(off,f.id,node,f.P);
  const safe=off.createDynamicsCompressor();
  safe.threshold.value=-1; safe.ratio.value=20; safe.knee.value=0; safe.attack.value=.002; safe.release.value=.08;
  node.connect(safe); safe.connect(off.destination);
  s.start(0);
  let rend=await off.startRendering();
  if(nf){
    /* second pass: exact peak of the fully-processed signal -> scale to target */
    const peak=bufPeak(rend);
    const tgt=Math.pow(10,nf.P.tgt/20);
    const g=peak>1e-6?Math.min(20,tgt/peak):1;
    if(g!==1){
      const out=AC().createBuffer(rend.numberOfChannels,rend.length,rend.sampleRate);
      for(let c=0;c<rend.numberOfChannels;c++){
        const d=rend.getChannelData(c), o=out.getChannelData(c);
        for(let i=0;i<d.length;i++) o[i]=d[i]*g;
      }
      rend=out;
    }
  }
  return rend;
}
function renderFx(){

  $('#exW').onclick=()=>{ if(S.proc) exportBuffer(S.proc,safeName(S.name)+'-fx','wav'); else toast('Render the chain first'); };

    S.fmt=c.dataset.f;
  });
  $('#clear').onclick=()=>{ S.files.length=0; drawList(); };
  $('#go').onclick=async()=>{
    if(!S.files.length) return;
    const btn=$('#go'); btn.disabled=true;
    const orig=btn.innerHTML;
    btn.innerHTML=IC.spinner+' Converting…';
    btn.querySelector('svg').classList.add('spin');
    const out=[];
    for(let i=0;i<S.files.length;i++){
      const f=S.files[i];
      const st=$('#bst'+i), bar=$('#br'+i+' .br-bar i');
      if(!st) continue;
      st.className='br-st work'; st.textContent='converting…';
      let blob,ext;
      try{
        if(S.fmt.indexOf('mp3')===0){
          blob=await mp3BlobAsync(f.buf,S.fmt==='mp3320'?320:160,p=>{ if(bar) bar.style.width=Math.round(p*100)+'%'; });
          ext='mp3';
        }else{ blob=wavBlob(f.buf); ext='wav'; if(bar) bar.style.width='100%'; }
      }catch(e){
        blob=null;
      }
      if(!blob){ st.className='br-st'; st.textContent='failed'; continue; }
      const nm=safeName(f.name)+'.'+ext;
      out.push({name:nm,blob});
      recordOutput(nm,blob);
      st.className='br-st done'; st.textContent=fmtSize(blob.size);
    }
    if(out.length){
      const files=[];
      for(const o of out) files.push({name:o.name,data:new Uint8Array(await o.blob.arrayBuffer())});
      downloadOnly(zipBlob(files),'audio-batch-'+String(Date.now()).slice(-6)+'.zip');
    }else toast('No files converted');
    btn.disabled=false; btn.innerHTML=orig;
  };
}

/* ================= live visualizer ================= */
function renderViz(){
  const S={buf:null,name:'',playing:false,src:null,analyser:null,raf:0};
  page.innerHTML=toolPage('Visualizer','Load a file and press play — live oscilloscope, 64-band spectrum analyzer, RMS/peak meters with clip detection. Perfect for checking levels before you export.',
   `<div class="panel">${dropHtml('Tap to choose an audio file','or drag & drop here')}</div>
    <div class="panel mt" id="work" hidden>
      <div class="row between">
        <div class="file-row" style="flex:1;min-width:220px;border:0;padding:0;gap:10px"><div class="file-ic">${IC.wave}</div><div class="file-meta"><div class="fm-n"><span id="fn"></span></div><div class="fm-s"><span id="fs"></span></div></div></div>
        <button class="btn primary" id="pp">${IC.play} Play</button>
      </div>
      <div class="viz-wrap mt">
        <canvas id="osc" height="110"></canvas>
        <canvas id="spec" height="140"></canvas>
      </div>
      <div class="viz-meters">
        <div class="viz-meter"><div class="vm-l">LEVEL · RMS</div><div class="vm-v" id="vu">-∞ dB</div></div>
        <div class="viz-meter"><div class="vm-l">PEAK</div><div class="vm-v" id="pk">-∞ dB</div></div>
        <div class="viz-meter"><div class="vm-l">CLIPPING</div><div class="vm-v" id="cl">—</div></div>
      </div>
    </div>`);
  const osc=$('#osc'), spec=$('#spec');
  function sizeCanvases(){
    const dpr=window.devicePixelRatio||1;
    [osc,spec].forEach(c=>{
      const w=c.clientWidth||c.parentElement.clientWidth, h=+c.getAttribute('height');
      c.width=Math.round(w*dpr); c.height=Math.round(h*dpr);
      c.style.height=h+'px';
      c.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    });
  }
  async function load(f){
    try{
      const buf=await decodeFile(f);
      S.buf=buf; S.name=f.name;
      $('#fn').textContent=f.name;
      $('#fs').textContent=fmtTime(buf.duration);
      $('#work').hidden=false;
      requestAnimationFrame(sizeCanvases);
      sizeCanvases();
    }catch(e){ toast("Couldn't decode "+f.name); }
  }
  attachDrop($('#dz'),fs=>load(fs[0]));
  function stopViz(){
    if(S.src){ try{S.src.stop();}catch(e){} S.src=null; }
    S.playing=false;
    cancelAnimationFrame(S.raf);
    const pp=$('#pp'); if(pp) pp.innerHTML=IC.play+' Play';
    $('#vu').textContent='-∞ dB'; $('#pk').textContent='-∞ dB'; $('#cl').textContent='—';
  }
  window.__pageStop=stopViz;
  const db=v=>v<=1e-5?'-∞':(20*Math.log10(v)).toFixed(1);
  $('#pp').onclick=async()=>{
    if(S.playing){ stopViz(); return; }
    if(!S.buf) return toast('Load a file first');
    const c=AC(); if(c.state==='suspended') await c.resume();
    const s=c.createBufferSource(); s.buffer=S.buf;
    S.analyser=c.createAnalyser(); S.analyser.fftSize=2048; S.analyser.smoothingTimeConstant=.82;
    const g=c.createGain(); g.gain.value=.95;
    s.connect(S.analyser); S.analyser.connect(g); g.connect(c.destination);
    s.onended=()=>{ if(S.src===s) stopViz(); };
    s.start();
    S.src=s; S.playing=true;
    sizeCanvases();
    $('#pp').innerHTML=IC.pause+' Stop';
    vizLoop();
  };
  function vizLoop(){
    if(!S.playing) return;
    const an=S.analyser;
    const tD=new Float32Array(an.fftSize);
    an.getFloatTimeDomainData(tD);
    // oscilloscope
    const octx=osc.getContext('2d');
    const ow=osc.clientWidth||osc.width, oh=+osc.getAttribute('height');
    octx.clearRect(0,0,ow,oh);
    octx.strokeStyle='rgba(34,211,238,.9)'; octx.lineWidth=1.8;
    octx.beginPath();
    for(let i=0;i<ow;i++){
      const v=tD[Math.floor(i/ow*tD.length)];
      const y=oh/2 - v*oh*.46;
      i?octx.lineTo(i,y):octx.moveTo(i,y);
    }
    octx.stroke();
    // spectrum (64 log-spaced bands)
    const fD=new Uint8Array(an.frequencyBinCount);
    an.getByteFrequencyData(fD);
    const sctx=spec.getContext('2d');
    const sw=spec.clientWidth||spec.width, sh=+spec.getAttribute('height');
    sctx.clearRect(0,0,sw,sh);
    const bars=64, bw=sw/bars;
    const nyq=(S.buf.sampleRate/2);
    for(let i=0;i<bars;i++){
      const f0=40*Math.pow(nyq/40,i/bars), f1=40*Math.pow(nyq/40,(i+1)/bars);
      const i0=Math.max(1,Math.floor(f0/(nyq)*fD.length)), i1=Math.max(i0+1,Math.floor(f1/(nyq)*fD.length));
      let mx=0;
      for(let j=i0;j<i1;j++) if(fD[j]>mx) mx=fD[j];
      const h=mx/255*(sh-8);
      const t=i/bars;
      sctx.fillStyle=`hsl(${190+t*110},85%,${45+t*20}%)`;
      sctx.fillRect(i*bw+1,sh-h-2,Math.max(1,bw-2),h);
    }
    // meters
    let sum=0,peak=0;
    for(let i=0;i<tD.length;i++){ const v=tD[i]; sum+=v*v; const a=Math.abs(v); if(a>peak)peak=a; }
    const rms=Math.sqrt(sum/tD.length);
    const vu=$('#vu'), pk=$('#pk'), cl=$('#cl');
    vu.textContent=db(rms)+' dB';
    pk.textContent=db(peak)+' dB';
    if(peak>.999){ cl.textContent='CLIP!'; cl.classList.add('clip'); }
    else if(peak>.9){ cl.textContent='hot'; cl.classList.remove('clip'); }
    else { cl.textContent='clean'; cl.classList.remove('clip'); }
    S.raf=requestAnimationFrame(vizLoop);
  }
}
</script>
<script>
'use strict';
/* ================= HOME ================= */
function toolCard(t){
  return `<div class="tool${t.pro?' locked':''}" data-go="${t.go||t.id}"${t.pro?' data-pro="1"':''}
    style="--c1:${t.c[0]};--c2:${t.c[1]};--ic:${t.icc}" role="button" tabindex="0" aria-label="${esc(t.nm)}">
    ${t.crown?`<span class="crown">${IC.crown}</span>`:''}
    ${t.ai?`<span class="ai-tag">AI</span>`:''}
    <span class="t-ic">${IC[t.ic]}</span>
    <span class="t-nm">${t.nm}</span>
    <span class="t-ds">${t.ds}</span>
  </div>`;
}
function renderHome(){
  const cards=cat=>TOOLS.filter(t=>t.cat===cat).map(toolCard).join('');
  page.innerHTML=`
  <div class="page">
    <div class="hero">
      <div class="hero-badge">${IC.bolt} 100% in-browser — your files never leave this device</div>
      <h1>Every audio tool you need, <span class="grad">right in your browser</span></h1>
      <p class="sub">Trim, merge, mix, split, boost and clean up audio & video. No installs, no uploads, no sign-in — just open a tool and go.</p>
      <div class="hero-cta">
        <button class="btn primary big" data-go="studio">${IC.layers} Open Multi-track Studio</button>
        <button class="btn ghost big" data-go="trim">${IC.scissors} Quick Trim</button>
      </div>
    </div>
    <h2 class="sec-title">${IC.scissors} Audio Editing</h2>
    <div class="tools">${cards('edit')}</div>
    <h2 class="sec-title">${IC.bolt} Audio Processing</h2>
    <div class="tools">${cards('proc')}</div>
    <h2 class="sec-title">${IC.check} How it works</h2>
    <div class="how">
      <div class="step"><div class="num">1</div><h3>Choose a tool</h3><p>Pick any tool above — everything runs locally with the Web Audio API.</p></div>
      <div class="step"><div class="num">2</div><h3>Drop in your files</h3><p>Audio (mp3, wav, m4a, ogg…) and video (mp4, webm…) all work. Nothing is uploaded anywhere.</p></div>
      <div class="step"><div class="num">3</div><h3>Edit & export</h3><p>Make your changes, preview instantly, then save as MP3 or WAV straight to your device.</p></div>
    </div>
    <div class="features">
      <span class="feature">${IC.shield} Private by design</span>
      <span class="feature">${IC.bolt} Instant, no install</span>
      <span class="feature">${IC.check} MP3 & WAV export</span>
      <span class="feature">${IC.music} Works on mobile</span>
    </div>
    <footer>Audio Editor — a web build of the mobile toolkit.<br>All processing happens on your device. Nothing is uploaded.</footer>
  </div>`;
}

/* ================= OUTPUTS ================= */
function renderOutputs(){
  page.innerHTML=toolPage('Outputs','Everything you exported in this session lives here. Files are kept in memory until you close the tab.',
   `<div class="panel">
      <div class="row between" style="margin-bottom:14px">
        <span class="muted" id="outCount"></span>
        <div class="row" style="gap:8px">
          <button class="btn primary small" id="outZip" hidden>${IC.download} Download all (.zip)</button>
          <button class="btn ghost small" id="outClear">Clear list</button>
        </div>
      </div>
      <div id="outList"></div>
    </div>`);
  function draw(){
    const list=$('#outList');
    $('#outCount').textContent=outputs.length+' file'+(outputs.length===1?'':'s');
    $('#outZip').hidden=!outputs.length;
    if(!outputs.length){
      list.innerHTML=`<div class="empty-studio" style="padding:40px 16px">${IC.folder}
        <div class="es-t">No exports yet</div>
        <div style="font-size:14px">Use any tool and hit MP3 or WAV — it shows up here.</div></div>`;
      return;
    }
    list.innerHTML=outputs.map((o,i)=>{
      const ext=o.name.split('.').pop().toLowerCase();
      const cls=ext==='mp3'?'mp3':(ext==='webm'?'webm':'');
      return `<div class="out-row">
        <div class="out-ic ${cls}">${ext==='webm'?IC.video:IC.music}</div>
        <div class="file-meta"><div class="fm-n">${esc(o.name)}</div>
        <div class="fm-s">${fmtSize(o.size)} · ${o.date.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div></div>
        <button class="btn ghost small" data-dl="${i}">${IC.download} Download</button>
        <button class="btn ghost small" data-del="${i}" title="Remove from list">${IC.trash}</button>
      </div>`;
    }).join('');
    $$('[data-dl]',list).forEach(b=>b.onclick=()=>{
      const o=outputs[+b.dataset.dl];
      const a=document.createElement('a'); a.href=o.url; a.download=o.name;
      document.body.appendChild(a); a.click(); a.remove();
    });
    $$('[data-del]',list).forEach(b=>b.onclick=()=>{
      const i=+b.dataset.del;
      URL.revokeObjectURL(outputs[i].url);
      outputs.splice(i,1);
      draw();
    });
  }
  $('#outZip').onclick=async()=>{
    if(!outputs.length) return;
    const btn=$('#outZip'); btn.disabled=true;
    toast('Zipping '+outputs.length+' files…',1600);
    try{
      const files=[];
      for(const o of outputs){
        const ab=await o.blob.arrayBuffer();
        files.push({name:o.name,data:new Uint8Array(ab)});
      }
      const n=new Date();
      const stamp=n.getFullYear()+String(n.getMonth()+1).padStart(2,'0')+String(n.getDate()).padStart(2,'0')+'-'+String(n.getHours()).padStart(2,'0')+String(n.getMinutes()).padStart(2,'0');
      downloadOnly(zipBlob(files),'audio-exports-'+stamp+'.zip');
    }catch(e){ console.warn(e); toast('Zip failed'); }
    btn.disabled=false;
  };
  $('#outClear').onclick=()=>{ outputs.forEach(o=>URL.revokeObjectURL(o.url)); outputs.length=0; draw(); };
  draw();
}

/* ================= menu ================= */
function buildMenu(){
  const m=$('#menu');
  const items=[
    {go:'home',nm:'Home',ic:'home'},
    {go:'studio',nm:'Multi-track Studio',ic:'layers'},
    {go:'outputs',nm:'Outputs',ic:'folder'},
    {sep:1},
    ...TOOLS.map(t=>({go:t.go||t.id,nm:t.nm,ic:t.ic,pro:t.pro})),
  ];
  m.innerHTML=items.map(it=>it.sep?'<div class="sep"></div>':`<button data-go="${it.go}"${it.pro?' data-pro="1"':''}>${IC[it.ic]}<span>${esc(it.nm)}</span></button>`).join('');
}
function toggleMenu(force){
  const m=$('#menu');
  m.classList.toggle('open',force);
}

/* ================= router ================= */
const routes={
  home:renderHome, studio:renderStudio, trim:renderTrim, merge:renderMerge, mix:renderMix,
  split:renderSplit, insert:renderInsert, boost:renderBoost, ringtone:renderRingtone,
  v2a:renderV2A, a2v:renderA2V, denoise:renderDenoise, voice:renderVoice, rec:renderRec,
  comp:renderComp, fx:renderFx, batch:renderBatch, viz:renderViz, outputs:renderOutputs,
};
const current=()=>{
  const h=location.hash.replace(/^#/,'');
  return routes[h]?h:'home';
};
function route(){
  const key=current();
  if(st.playing) stPause();
  if(window.__pageStop) window.__pageStop();
  window.__pageStop=null;
  stopToolPlayer();
  closePopover();
  closeModal();
  (routes[key]||renderHome)();
  $$('#bnav a').forEach(a=>a.classList.toggle('on',a.dataset.nav===key));
  window.scrollTo({top:0,behavior:'auto'});
}

/* ================= global events ================= */
document.addEventListener('click',e=>{
  const pro=e.target.closest('[data-pro]');
  if(pro){
    e.preventDefault();
    toggleMenu(false);
    proModal(pro.dataset.go||pro.closest('[data-go]')?.dataset.go);
    return;
  }
  const go=e.target.closest('[data-go]');
  if(go){
    e.preventDefault();
    toggleMenu(false);
    const target=go.dataset.go;
    if(current()===target) route(); else location.hash=target;
    return;
  }
  if(!e.target.closest('.menu-wrap')) toggleMenu(false);
});
document.addEventListener('keydown',e=>{
  const tag=(document.activeElement&&document.activeElement.tagName)||'';
  if(e.key==='Escape'){ closeModal(); closePopover(); toggleMenu(false); }
  if(e.code==='Space'&&current()==='studio'&&!/INPUT|TEXTAREA|SELECT|BUTTON/.test(tag)){
    e.preventDefault(); stPlay();
  }
  if((e.ctrlKey||e.metaKey)&&(e.key==='z'||e.key==='Z')){
    if(current()==='studio'){ e.preventDefault(); if(e.shiftKey) stRedo(); else stUndo(); }
  }
  if((e.ctrlKey||e.metaKey)&&(e.key==='y'||e.key==='Y')){
    if(current()==='studio'){ e.preventDefault(); stRedo(); }
  }
  /* studio: +/− zoom, Delete/Backspace remove clip, Home/End playhead jump */
  if(current()==='studio'&&!/INPUT|TEXTAREA|SELECT|BUTTON/.test(tag)){
    if(e.key==='+'||e.key==='='){ e.preventDefault(); st.zoom(1.45); }
    else if(e.key==='-'){ e.preventDefault(); st.zoom(1/1.45); }
    else if(e.key==='Delete'||e.key==='Backspace'){ e.preventDefault(); stDeleteClip(); }
    else if(e.key==='Home'){ e.preventDefault(); st.playhead=0; stDirty(); }
    else if(e.key==='End'){ e.preventDefault(); st.playhead=stTotal(); stDirty(); }
  }
});
let rszT=0;
window.addEventListener('resize',()=>{
  clearTimeout(rszT);
  rszT=setTimeout(()=>{
    if(current()==='studio') stDirty();
    else if(window.__pageRedraw) window.__pageRedraw();
  },120);
});

/* ================= boot ================= */
window.addEventListener('hashchange',route);
buildMenu();
$('#menuBtn').onclick=e=>{ e.stopPropagation(); toggleMenu(); };
$('#proBtn').onclick=()=>{
  openModal(`
    <div class="m-ic">${IC.crown}</div>
    <h3>Go PRO</h3>
    <p>PRO adds AI voice changer, the voice recorder, the compressor and priority rendering. This demo includes all the core tools — free.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn primary" onclick="closeModal()">Nice</button></div>`);
};
window.__pageStop=null;
window.__pageRedraw=null;
/* PWA: service worker + install prompt (skipped under file:// and QA) */
(function(){
  if(window.__QA) return;
  if(!('serviceWorker' in navigator)) return;
  if(location.protocol!=='https:'&&location.protocol!=='http:') return;
  const ok=location.hostname==='localhost'||/github\.io$/.test(location.hostname);
  if(!ok) return;
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
})();
route();
</script>
</body>
