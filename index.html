<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1130">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Audio Editor — free in-browser audio toolkit: trim, merge, mix, split, multi-track editing, noise removal, video to MP3 and more. 100% private, files never leave your device.">
<title>Audio Editor — Free In-Browser Audio Toolkit</title>
<style>
:root{
  --bg:#0a1130; --panel:rgba(20,32,72,.6); --line:rgba(148,163,255,.14); --line2:rgba(148,163,255,.28);
  --text:#f0f4ff; --muted:#8f9cc6; --dim:#5c6a99;
  --cyan:#22d3ee; --blue:#3b82f6; --indigo:#6366f1; --green:#34d399;
  --amber:#fbbf24; --orange:#f97316; --pink:#e879f9; --red:#fb7185; --purple:#a78bfa;
  --rad:16px; --shadow:0 18px 40px rgba(2,6,24,.45);
}
:root[data-theme="light"]{
  --bg:#eef1fb; --panel:rgba(255,255,255,.82); --line:rgba(30,41,90,.13); --line2:rgba(30,41,90,.26);
  --text:#131a3d; --muted:#48527a; --dim:#7d88ad;
  --cyan:#0891b2; --blue:#2563eb; --indigo:#4f46e5; --green:#059669;
  --amber:#d97706; --orange:#ea580c; --pink:#c026d3; --red:#e11d48; --purple:#7c3aed;
  --shadow:0 18px 40px rgba(30,41,90,.14);
}
:root[data-theme="light"] body{background:
  radial-gradient(700px 420px at 85% -5%,rgba(59,130,246,.14),transparent 60%),
  radial-gradient(600px 400px at -10% 30%,rgba(192,38,211,.10),transparent 60%),var(--bg)}
:root[data-theme="light"] .header{background:rgba(255,255,255,.85)}
:root[data-theme="light"] .bnav{background:rgba(255,255,255,.9)}
:root[data-theme="light"] .studio-scroll{background:#f6f8ff}
:root[data-theme="light"] .toast{background:#fff}
:root[data-theme="light"] .enc-hud{background:rgba(255,255,255,.95)}
:root[data-theme="light"] .tool::before{background:radial-gradient(140px 90px at 50% 0%,rgba(255,255,255,.65),transparent 70%)}
:root[data-theme="light"] .hero-badge{color:#0b6e8f;background:rgba(8,145,178,.12);border-color:rgba(8,145,178,.35)}
:root[data-theme="light"] .hero-badge svg{color:#0891b2}
:root[data-theme="light"] .tool .t-ds{color:rgba(226,232,255,.62)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 700px at 85% -10%, rgba(59,130,246,.16), transparent 60%),
    radial-gradient(900px 600px at -10% 30%, rgba(124,58,237,.10), transparent 55%),
    radial-gradient(1000px 800px at 50% 120%, rgba(34,211,238,.07), transparent 60%),
    linear-gradient(180deg,#070c22 0%, #0a1130 45%, #0a1332 100%);
  background-attachment:fixed;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
::selection{background:rgba(99,102,241,.4)}

/* ---------- header ---------- */
.header{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;
  padding:12px clamp(14px,4vw,28px);
  background:rgba(7,11,30,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);transition:.15s;flex:none}
.icon-btn:hover{background:rgba(148,163,255,.1);color:var(--text)}
.icon-btn svg{width:21px;height:21px}
.brand{display:flex;align-items:center;gap:10px;font-size:clamp(18px,2.4vw,21px);font-weight:800;letter-spacing:.2px;cursor:pointer;user-select:none;white-space:nowrap}
.brand .logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;
  background:linear-gradient(135deg,var(--indigo),var(--blue));box-shadow:0 6px 18px rgba(59,130,246,.4)}
.brand .logo svg{width:20px;height:20px;color:#fff}
.spacer{flex:1}
.pro-badge{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:11px;font-weight:800;font-size:13px;
  color:#3a2404;background:linear-gradient(135deg,#fcd34d,#f97316);
  box-shadow:0 6px 16px rgba(249,115,22,.35);transition:.15s;letter-spacing:.5px;flex:none}
.pro-badge:hover{transform:translateY(-1px)}
.pro-badge svg{width:14px;height:14px}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:50px;min-width:240px;max-height:70vh;overflow:auto;background:#0e1739;border:1px solid var(--line2);
  border-radius:14px;padding:8px;box-shadow:var(--shadow);display:none;z-index:70}
.menu.open{display:block;animation:pop .18s ease}
.menu button{display:flex;width:100%;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--muted);font-size:14.5px;font-weight:600;text-align:left}
.menu button:hover{background:rgba(148,163,255,.08);color:var(--text)}
.menu button svg{width:17px;height:17px;flex:none}
.menu .sep{height:1px;background:var(--line);margin:7px 8px}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}

/* ---------- layout ---------- */
main{max-width:1180px;margin:0 auto;padding:clamp(18px,3.5vw,34px) clamp(14px,4vw,28px) 60px;min-height:60vh}
.page{animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:clamp(26px,4.5vw,38px);font-weight:800;letter-spacing:-.5px}
h2.sec-title{font-size:clamp(19px,3vw,24px);font-weight:800;margin:36px 0 14px;display:flex;align-items:center;gap:10px}
h2.sec-title svg{width:22px;height:22px;color:var(--cyan)}
.sub{color:var(--muted);margin-top:8px;font-size:15px;max-width:640px;line-height:1.55}
.back-row{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.back-btn{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-weight:700;font-size:14px;padding:8px 12px;border-radius:10px;border:1px solid var(--line)}
.back-btn:hover{color:var(--text);background:rgba(148,163,255,.08)}
.back-btn svg{width:16px;height:16px}

/* ---------- hero ---------- */
.hero{padding:clamp(10px,2.5vw,26px) 0 4px}
.hero-badge{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:#bfe9ff;
  background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.3);padding:7px 14px;border-radius:999px;margin-bottom:18px}
.hero-badge svg{width:14px;height:14px;color:var(--cyan)}
.hero h1{max-width:780px;line-height:1.12}
.grad{background:linear-gradient(92deg,#22d3ee,#818cf8 55%,#e879f9);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14.5px;
  padding:11px 18px;border-radius:12px;transition:.16s;white-space:nowrap;border:1px solid transparent;
  -webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.96)}
.chip:active{transform:scale(.95)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--indigo),var(--blue));box-shadow:0 8px 22px rgba(59,130,246,.35);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:rgba(148,163,255,.07);border-color:var(--line2);color:var(--text)}
.btn.ghost:hover{background:rgba(148,163,255,.14)}
.btn.small{padding:8px 13px;font-size:13px;border-radius:10px}
.btn.big{padding:14px 24px;font-size:16px;border-radius:14px}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.on{background:rgba(34,211,238,.14);border-color:rgba(34,211,238,.5);color:#7dd3fc}
.btn svg{width:17px;height:17px;flex:none}

/* ---------- tool cards ---------- */
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.tool{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;
  min-height:158px;padding:26px 14px 20px;border-radius:20px;cursor:pointer;overflow:hidden;
  background:linear-gradient(165deg,var(--c1),var(--c2));
  border:1px solid rgba(148,163,255,.12);transition:transform .18s ease, box-shadow .18s ease, border-color .18s}
.tool::before{content:"";position:absolute;inset:0;background:radial-gradient(140px 90px at 50% 0%,rgba(255,255,255,.09),transparent 70%)}
.tool:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(2,6,24,.5);border-color:rgba(148,163,255,.32)}
.tool:active{transform:translateY(-1px) scale(.99)}
.tool .t-ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:var(--ic);
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.1);box-shadow:0 6px 16px rgba(0,0,0,.25)}
.tool .t-ic svg{width:26px;height:26px}
.tool .t-nm{font-weight:800;font-size:15.5px;color:#fff;text-shadow:0 1px 8px rgba(2,6,24,.55);text-align:center;line-height:1.25;position:relative}
.tool .t-ds{font-size:11.5px;color:rgba(224,231,255,.55);text-align:center;line-height:1.35;position:relative}
.tool .crown{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;
  background:rgba(251,191,36,.16);color:#fcd34d;border:1px solid rgba(251,191,36,.35)}
.tool .crown svg{width:13px;height:13px}
.tool .ai-tag{position:absolute;top:10px;left:10px;font-size:10px;font-weight:800;letter-spacing:.6px;color:#7dd3fc;
  background:rgba(14,116,144,.35);border:1px solid rgba(34,211,238,.4);padding:3px 7px;border-radius:7px}

/* ---------- panels / rows ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:clamp(14px,2.5vw,22px);backdrop-filter:blur(8px)}
.panel + .panel{margin-top:16px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.mt{margin-top:16px}
.muted{color:var(--muted)}
.dim{color:var(--dim)}

/* ---------- dropzone ---------- */
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;text-align:center;
  border:2px dashed rgba(148,163,255,.35);border-radius:16px;padding:clamp(24px,5vw,42px) 16px;cursor:pointer;
  color:var(--muted);transition:.16s;background:rgba(148,163,255,.03)}
.drop:hover,.drop.over{border-color:var(--cyan);background:rgba(34,211,238,.06)}
.drop svg{width:38px;height:38px;color:var(--cyan)}
.drop .d-main{font-weight:700;font-size:15.5px;color:var(--text)}
.drop .d-sub{font-size:13px}

/* ---------- sliders / chips ---------- */
.slider{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;background:rgba(148,163,255,.2);outline:none}
.slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;
  background:linear-gradient(135deg,#818cf8,#3b82f6);border:2px solid rgba(255,255,255,.25);box-shadow:0 3px 10px rgba(59,130,246,.5);cursor:pointer}
.slider::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#3b82f6;border:2px solid rgba(255,255,255,.2);cursor:pointer}
label.lbl{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;display:block;margin-bottom:8px}
.inp{background:rgba(10,17,42,.8);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;font-size:14px;color:var(--text);min-width:90px}
.inp:focus{outline:none;border-color:var(--blue)}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;padding:8px 13px;border-radius:10px;
  background:rgba(148,163,255,.07);border:1px solid var(--line2);color:var(--text);cursor:pointer;transition:.15s;user-select:none}
.chip:hover{background:rgba(148,163,255,.13)}
.chip.on{background:linear-gradient(135deg,rgba(99,102,241,.4),rgba(59,130,246,.4));border-color:rgba(99,102,241,.6)}
.chip svg{width:16px;height:16px;stroke-width:2.5}

/* ---------- waveform ---------- */
.wave-wrap{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#0a1230}
.wave-wrap canvas{display:block;width:100%;height:190px;touch-action:none;cursor:crosshair}
.wave-wrap.sm canvas{height:92px}

/* ---------- studio ---------- */
.studio-top{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.studio-title{font-size:clamp(18px,3vw,22px);font-weight:800;margin-right:auto}
.studio-scroll{overflow:auto;border-radius:14px;border:1px solid var(--line);background:#0a1230;touch-action:none;max-height:56vh;position:relative}
.studio-scroll canvas{display:block}
.studio-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:14px;flex-wrap:wrap}
.time-label{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:var(--muted);min-width:138px;text-align:center}
.time-label b{color:var(--text)}
.play-btn{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:linear-gradient(135deg,#38bdf8,#3b82f6);box-shadow:0 10px 26px rgba(56,189,248,.4);transition:.15s}
.play-btn:hover{filter:brightness(1.07)}
.play-btn:active{transform:scale(.95)}
.play-btn svg{width:26px;height:26px;color:#fff}
.studio-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.tool-btn{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:76px;padding:11px 10px;border-radius:13px;
  background:rgba(148,163,255,.06);border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:700;transition:.15s}
.tool-btn svg{width:20px;height:20px;stroke-width:2.4}
.tool-btn:hover:not(.off){color:var(--text);background:rgba(148,163,255,.12);border-color:var(--line2)}
.tool-btn:active{transform:scale(.96)}
.tool-btn.off{opacity:.45}
.tool-btn .tb-v{font-size:9.5px;font-weight:800;letter-spacing:.3px;color:#67e8f9;background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.3);padding:1px 7px;border-radius:99px;line-height:1.5;white-space:nowrap}
.tool-btn:disabled{opacity:.35;cursor:not-allowed}
.tool-btn.on{color:#7dd3fc;border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.1)}
.empty-studio{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:64px 20px;text-align:center;color:var(--muted)}
.empty-studio svg{width:54px;height:54px;color:var(--cyan);opacity:.85}
.empty-studio .es-t{font-weight:800;font-size:17px;color:var(--text)}
.pop{position:fixed;z-index:80;background:#111c44;border:1px solid var(--line2);border-radius:14px;padding:16px;
  box-shadow:var(--shadow);width:260px;animation:pop .16s ease}
.pop .pop-h{font-weight:800;font-size:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pop .pop-v{font-variant-numeric:tabular-nums;color:var(--cyan);font-weight:800;font-size:13px}

/* ---------- file rows ---------- */
.file-row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:13px;background:rgba(148,163,255,.04)}
.file-row + .file-row{margin-top:10px}
.file-ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;background:rgba(99,102,241,.15);color:#a5b4fc}
.file-ic svg{width:19px;height:19px}
.file-meta{flex:1;min-width:0}
.file-meta .fm-n{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-meta .fm-s{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.icon-sq{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-sq:hover{background:rgba(148,163,255,.1);color:var(--text)}
.icon-sq.danger:hover{background:rgba(244,63,94,.15);color:#fda4af}
.icon-sq:disabled{opacity:.25;cursor:not-allowed}
.icon-sq svg{width:17px;height:17px}

/* ---------- outputs ---------- */
.out-row{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(148,163,255,.04);flex-wrap:wrap}
.out-row + .out-row{margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.fx-row{display:flex;flex-wrap:wrap;gap:8px}
.rec-stage{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 16px}
.rec-ring{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line2);background:rgba(148,163,255,.05);transition:transform .15s}
.rec-ring.rec{border-color:rgba(244,63,94,.7);box-shadow:0 0 0 8px rgba(244,63,94,.12),0 0 34px rgba(244,63,94,.4);animation:recPulse 1.4s ease-in-out infinite}
@keyframes recPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.rec-btn{width:84px;height:84px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--indigo),var(--blue));color:#fff;display:grid;place-items:center;box-shadow:0 10px 26px rgba(59,130,246,.4)}
.rec-btn svg{width:34px;height:34px}
.rec-ring.rec .rec-btn{background:linear-gradient(135deg,#f43f5e,#e11d48);box-shadow:0 10px 26px rgba(244,63,94,.45)}
.rec-lbl{font-size:14px;color:var(--muted);font-weight:600}
.rec-meter{width:100%;max-width:280px;height:8px;border-radius:99px;background:rgba(148,163,255,.12);overflow:hidden}
.rec-meter div{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#22d3ee,#3b82f6,#e879f9);transition:width .06s linear}
.rec-time{font-variant-numeric:tabular-nums;font-weight:800;font-size:22px;letter-spacing:.06em}
.out-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;background:rgba(52,211,153,.12);color:var(--green)}
.out-ic.mp3{background:rgba(251,146,60,.12);color:var(--orange)}
.out-ic.webm{background:rgba(167,139,250,.12);color:var(--purple)}
.out-ic svg{width:20px;height:20px}

/* ---------- how / features / footer ---------- */
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:14px}
.how .step{position:relative;padding:20px;border-radius:18px;border:1px solid var(--line);background:var(--panel)}
.how .step .num{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:15px;
  background:linear-gradient(135deg,var(--indigo),var(--blue));margin-bottom:12px;box-shadow:0 6px 14px rgba(59,130,246,.35)}
.how .step h3{font-size:16px;font-weight:800;margin-bottom:6px}
.how .step p{font-size:13.5px;color:var(--muted);line-height:1.5}
.features{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.feature{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:700;color:var(--muted);
  padding:10px 15px;border-radius:12px;border:1px solid var(--line);background:rgba(148,163,255,.04)}
.feature svg{width:17px;height:17px;color:var(--green);flex:none}
footer{border-top:1px solid var(--line);margin-top:54px;padding:22px 0 8px;color:var(--dim);font-size:13px;text-align:center;line-height:1.6}

/* ---------- modal / toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(4,8,24,.7);backdrop-filter:blur(4px);z-index:90;display:grid;place-items:center;padding:20px;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:min(440px,100%);background:#0f1838;border:1px solid var(--line2);border-radius:20px;padding:26px;box-shadow:var(--shadow);animation:pop .2s ease}
.modal .m-ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;margin-bottom:14px;
  background:linear-gradient(135deg,rgba(251,191,36,.25),rgba(249,115,22,.25));color:#fcd34d}
.modal .m-ic svg{width:24px;height:24px}
.modal h3{font-size:19px;font-weight:800;margin-bottom:8px}
.modal p{color:var(--muted);font-size:14.5px;line-height:1.55;margin-bottom:18px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);z-index:100;
  background:#101b40;border:1px solid var(--line2);color:var(--text);font-size:14px;font-weight:600;
  padding:11px 18px;border-radius:12px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.22s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
[hidden]{display:none!important}
.spin{display:inline-block;animation:rot .9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.enc-hud{position:fixed;left:50%;bottom:138px;transform:translateX(-50%);z-index:99;display:flex;align-items:center;gap:10px;
  background:rgba(10,16,38,.94);border:1px solid var(--line2);border-radius:14px;padding:11px 15px;backdrop-filter:blur(10px);
  box-shadow:var(--shadow);min-width:236px;max-width:92vw}
.enc-hud .enc-ic{display:grid;place-items:center;color:var(--cyan)}
.enc-hud .enc-txt{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.enc-hud .enc-track{flex:1;height:6px;border-radius:99px;background:rgba(148,163,255,.15);overflow:hidden;min-width:54px}
.enc-hud .enc-track i{display:block;height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#22d3ee,#3b82f6);transition:width .1s linear}

/* ---------- theme toggle ---------- */
.theme-btn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;
  background:rgba(148,163,255,.08);border:1px solid var(--line2);color:var(--muted);cursor:pointer;transition:.15s}
.theme-btn:hover{color:var(--text);background:rgba(148,163,255,.16)}
.theme-btn svg{width:19px;height:19px}

/* ---------- FX rack (effects chain) ---------- */
.fx-eff{border:1px solid var(--line);border-radius:14px;background:rgba(148,163,255,.03);overflow:hidden;margin-top:10px}
.fx-eff-h{display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer}
.fx-eff-h:active{background:rgba(148,163,255,.05)}
.fx-eff-h .fx-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;
  background:rgba(148,163,255,.09);color:var(--muted)}
.fx-eff-h .fx-ic svg{width:17px;height:17px}
.fx-eff.on .fx-ic{background:linear-gradient(135deg,rgba(99,102,241,.35),rgba(59,130,246,.35));color:var(--cyan)}
.fx-eff-h .fx-nm{font-weight:800;font-size:14px;flex:1}
.fx-eff-h .fx-st{font-size:11px;font-weight:700;color:var(--dim)}
.fx-eff.on .fx-st{color:var(--green)}
.fx-sw{position:relative;width:40px;height:23px;border-radius:99px;background:rgba(148,163,255,.15);flex:none;transition:.18s}
.fx-sw i{position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#8f9cc6;transition:.18s}
.fx-eff.on .fx-sw{background:linear-gradient(90deg,var(--indigo),var(--blue))}
.fx-eff.on .fx-sw i{left:20px;background:#fff}
.fx-eff-b{display:none;padding:2px 13px 14px;border-top:1px solid var(--line)}
.fx-eff.open .fx-eff-b{display:block}
.fx-params{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:6px}
@media(max-width:430px){.fx-params{grid-template-columns:1fr}}
.fx-band{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:10px}
.fx-band .fx-bv{font-size:11.5px;font-weight:800;color:var(--cyan);text-align:right;font-variant-numeric:tabular-nums}
.fx-order{display:flex;align-items:center;gap:5px;color:var(--dim);font-size:18px;font-weight:800;padding:4px 0;user-select:none}
.fx-order button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:rgba(148,163,255,.06);color:var(--muted);cursor:pointer;font-size:13px}
.fx-order button:active{transform:scale(.94)}

/* ---------- visualizer ---------- */
.viz-wrap{border-radius:14px;background:#05081a;border:1px solid var(--line);overflow:hidden}
.viz-wrap canvas{display:block;width:100%}
.viz-meters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.viz-meter{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:rgba(148,163,255,.03)}
.viz-meter .vm-l{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.4px}
.viz-meter .vm-v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.viz-meter .vm-v.clip{color:var(--red)}

/* ---------- batch converter ---------- */
.batch-row{display:flex;align-items:center;gap:11px;padding:11px;border:1px solid var(--line);border-radius:12px;background:rgba(148,163,255,.03);margin-top:8px}
.batch-row .br-st{font-size:12px;font-weight:700;color:var(--dim);white-space:nowrap}
.batch-row .br-st.done{color:var(--green)}
.batch-row .br-st.work{color:var(--cyan)}
.batch-row .br-bar{flex:1;height:5px;border-radius:99px;background:rgba(148,163,255,.12);overflow:hidden}
.batch-row .br-bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#22d3ee,#3b82f6);border-radius:99px}
.batch-fmt{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- video preview ---------- */
.av-wrap{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#000;aspect-ratio:16/9}
.av-wrap canvas{display:block;width:100%;height:100%}
.prog{height:8px;border-radius:99px;background:rgba(148,163,255,.15);overflow:hidden}
.prog > div{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--purple));transition:width .2s linear}

/* ---------- bottom nav (mobile) ---------- */
.bnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:70;
  background:rgba(7,11,30,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  grid-template-columns:repeat(3,1fr);gap:6px}
.bnav a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--dim);padding:7px 4px;border-radius:10px}
.bnav a svg{width:21px;height:21px}
.bnav a.on{color:var(--cyan)}
@media (max-width:760px){
  .bnav{display:grid}
  main{padding-bottom:120px}
  .tools{grid-template-columns:repeat(2,1fr)}
  .tool{min-height:140px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ================= audio core ================= */
let _ctx=null;
function AC(){ if(!_ctx){ _ctx=new (window.AudioContext||window.webkitAudioContext)(); } return _ctx; }
async function decodeFile(f){ const ab=await f.arrayBuffer(); return await AC().decodeAudioData(ab); }

function toInt16(f32){
  const i16=new Int16Array(f32.length);
  for(let i=0;i<f32.length;i++){ let v=f32[i]; v=v<-1?-1:v>1?1:v; i16[i]=v<0?v*32768:v*32767; }
  return i16;
}
function wavBlob(buf){
  const nc=buf.numberOfChannels, sr=buf.sampleRate, len=buf.length;
  const ba=nc*2, ds=len*ba, ab=new ArrayBuffer(44+ds), dv=new DataView(ab);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF'); dv.setUint32(4,36+ds,true); ws(8,'WAVE'); ws(12,'fmt ');
  dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,nc,true);
  dv.setUint32(24,sr,true); dv.setUint32(28,sr*ba,true); dv.setUint16(32,ba,true); dv.setUint16(34,16,true);
  ws(36,'data'); dv.setUint32(40,ds,true);
  const ch=[]; for(let c=0;c<nc;c++)ch.push(buf.getChannelData(c));
  let o=44;
  for(let i=0;i<len;i++){ for(let c=0;c<nc;c++){ let v=ch[c][i]; v=v<-1?-1:v>1?1:v; dv.setInt16(o,v<0?v*32768:v*32767,true); o+=2; } }
  return new Blob([ab],{type:'audio/wav'});
}
function resampleLinear(buf,targetSR){
  const out=AC().createBuffer(2,buf.length,targetSR);
  const nc=Math.min(2,buf.numberOfChannels);
  for(let c=0;c<nc;c++){
    const d=buf.getChannelData(c), o=out.getChannelData(c);
    const ratio=buf.sampleRate/targetSR;
    for(let i=0;i<o.length;i++){ const t=i*ratio, i0=Math.floor(t), i1=Math.min(d.length-1,i0+1), f=t-i0; o[i]=d[i0]*(1-f)+d[i1]*f; }
  }
  return out;
}
/* ---- lazy MP3 encoder: compiles on first use so initial load stays fast ---- */
let _lameState=0; // 0 unknown · 1 ready · 2 unavailable
function ensureLame(){
  if(window.lamejs&&window.lamejs.Mp3Encoder) return true;
  if(_lameState===2) return false;
  const s=_lameSrc();
  if(!s){ _lameState=2; return false; }
  try{ (0,eval)(s); }catch(e){ console.warn('lame init failed',e); }
  const ok=!!(window.lamejs&&window.lamejs.Mp3Encoder);
  _lameState=ok?1:2;
  return ok;
}
function mp3Blob(buf,kbps=160){
  try{
    if(!ensureLame()) return null;
    const L=window.lamejs;
    let b=buf, sr=buf.sampleRate;
    const ok=[44100,48000,32000,22050,16000,11025,8000].includes(sr);
    if(!ok){ b=resampleLinear(buf,44100); sr=44100; }
    const nc=b.numberOfChannels, len=b.length;
    const enc=new L.Mp3Encoder(nc,sr,Math.min(kbps,320));
    const bs=1152, out=[];
    const Lch=toInt16(b.getChannelData(0));
    const Rch=nc>1?toInt16(b.getChannelData(1)):Lch;
    for(let i=0;i<len;i+=bs){
      const l=Lch.subarray(i,Math.min(len,i+bs));
      const r=Rch.subarray(i,Math.min(len,i+bs));
      const d=nc>1?enc.encodeBuffer(l,r):enc.encodeBuffer(l);
      if(d.length)out.push(d);
    }
    const e=enc.flush(); if(e.length)out.push(e);
    return new Blob(out,{type:'audio/mpeg'});
  }catch(err){ console.warn('mp3 encode failed',err); return null; }
}
function sliceBuf(buf,a,b){
  const sr=buf.sampleRate, i0=Math.max(0,Math.floor(a*sr));
  const n=Math.min(buf.length-i0,Math.max(1,Math.ceil(Math.max(0,b-a)*sr)));
  const out=AC().createBuffer(buf.numberOfChannels,n,sr);
  for(let c=0;c<buf.numberOfChannels;c++) out.getChannelData(c).set(buf.getChannelData(c).subarray(i0,i0+n));
  return out;
}

/* ---- Web-Worker MP3 encoder (UI never freezes) ---- */
let _mp3w=null,_mp3wDead=false;
function _lameSrc(){
  const el=document.getElementById('lamejs-src');
  if(el&&el.textContent&&el.textContent.indexOf('Mp3Encoder')>-1) return el.textContent;
  for(const s of document.scripts){ const t=s.textContent; if(t&&t.length>20000&&t.indexOf('Mp3Encoder')>-1&&t.indexOf('lamejs-src')<0) return t; }
  return null;
}
const _MP3_WORKER_CODE='\n;('+function(){
  self.onmessage=function(e){
    var d=e.data,L=self.lamejs,bs=1152;
    var enc=new L.Mp3Encoder(d.nc,d.sr,d.kbps);
    var out=[],i=0,len=d.L.length;
    function step(){
      var guard=0;
      while(i<len&&guard<120){
        var end=Math.min(len,i+bs);
        var l=d.L.subarray(i,end);
        var m=d.nc>1?enc.encodeBuffer(l,d.R.subarray(i,end)):enc.encodeBuffer(l);
        if(m.length)out.push(m);
        i=end;guard++;
      }
      if(i<len){ self.postMessage({t:'p',p:i/len}); setTimeout(step,0); }
      else{
        var f=enc.flush(); if(f.length)out.push(f);
        var total=0,k; for(k=0;k<out.length;k++) total+=out[k].length;
        var u=new Uint8Array(total); var o=0;
        for(k=0;k<out.length;k++){ u.set(out[k],o); o+=out[k].length; }
        self.postMessage({t:'d',u:u},[u.buffer]);
      }
    }
    step();
  };
}.toString()+')();';
function mp3WorkerGet(){
  if(_mp3wDead) return null;
  if(_mp3w) return _mp3w;
  try{
    const src=_lameSrc(); if(!src) return null;
    _mp3w=new Worker(URL.createObjectURL(new Blob([src+_MP3_WORKER_CODE],{type:'text/javascript'})));
    _mp3w.onerror=()=>{ _mp3wDead=true; try{_mp3w.terminate();}catch(e){} _mp3w=null; };
    return _mp3w;
  }catch(e){ _mp3wDead=true; return null; }
}
async function mp3BlobAsync(buf,kbps=160,onProg){
  let b=buf,sr=buf.sampleRate;
  const ok=[44100,48000,32000,22050,16000,11025,8000].includes(sr);
  if(!ok){ b=resampleLinear(buf,44100); sr=44100; }
  const nc=b.numberOfChannels,len=b.length;
  const Lch=toInt16(b.getChannelData(0));
  const Rch=nc>1?toInt16(b.getChannelData(1)):Lch;
  const w=mp3WorkerGet();
  if(w){
    try{
      return await new Promise((resolve,reject)=>{
        let done=false;
        const onmsg=e=>{
          const d=e.data;
          if(d.t==='p'){ if(onProg) onProg(d.p); return; }
          if(d.t==='d'&&!done){ done=true; w.removeEventListener('message',onmsg); w.removeEventListener('error',onerr); if(onProg) onProg(1); resolve(new Blob([d.u],{type:'audio/mpeg'})); }
        };
        const onerr=()=>{ if(!done){ done=true; w.removeEventListener('message',onmsg); w.removeEventListener('error',onerr); reject(new Error('worker encode failed')); } };
        w.addEventListener('message',onmsg); w.addEventListener('error',onerr);
        w.postMessage({L:Lch,R:Rch,nc,sr,kbps:Math.min(kbps,320)});
      });
    }catch(e){ console.warn('worker mp3 failed, falling back',e); }
  }
  /* chunked async fallback — yields to keep UI smooth */
  if(!ensureLame()) return null;
  const L=window.lamejs;
  const enc=new L.Mp3Encoder(nc,sr,Math.min(kbps,320));
  const bs=1152,out=[];
  for(let i=0;i<len;i+=bs){
    const l=Lch.subarray(i,Math.min(len,i+bs));
    const m=nc>1?enc.encodeBuffer(l,Rch.subarray(i,Math.min(len,i+bs))):enc.encodeBuffer(l);
    if(m.length)out.push(m);
    if(((i/bs)|0)%60===59){ if(onProg) onProg(i/len); await sleep(0); }
  }
  const e2=enc.flush(); if(e2.length)out.push(e2);
  if(onProg) onProg(1);
  return new Blob(out,{type:'audio/mpeg'});
}
async function exportBuffer(buf,name,fmt,kbps=160){
  if(fmt==='mp3'){
    encHud(true,0,'Encoding '+name+'.mp3…');
    let m=null;
    try{ m=await mp3BlobAsync(buf,kbps,p=>encHud(true,p,'Encoding '+name+'.mp3…')); }
    catch(e){ console.warn('mp3 encode error',e); }
    encHud(false);
    if(m){ downloadBlob(m,name+'.mp3'); return; }
    toast('MP3 encoder unavailable — saved as WAV');
  }
  downloadBlob(wavBlob(buf),name+'.wav');
}

/* ---- minimal ZIP writer (store method, no compression) ---- */
let _crcT=null;
function crc32(u8){
  if(!_crcT){ _crcT=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; _crcT[n]=c; } }
  let crc=0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) crc=_crcT[(crc^u8[i])&0xFF]^(crc>>>8);
  return (crc^0xFFFFFFFF)>>>0;
}
function zipBlob(files){
  const enc=new TextEncoder(), chunks=[], central=[];
  let offset=0;
  const d=new Date();
  const dosD=((d.getUTCFullYear()-1980)<<9)|((d.getUTCMonth()+1)<<5)|d.getUTCDate();
  const dosT=(d.getUTCHours()<<11)|(d.getUTCMinutes()<<5)|(d.getUTCSeconds()>>1);
  for(const f of files){
    const nameB=enc.encode(f.name), crc=crc32(f.data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0,true); lh.setUint16(8,0,true);
    lh.setUint16(10,dosT,true); lh.setUint16(12,dosD,true);
    lh.setUint32(14,crc,true); lh.setUint32(18,f.data.length,true); lh.setUint32(22,f.data.length,true);
    lh.setUint16(26,nameB.length,true); lh.setUint16(28,0,true);
    chunks.push(new Uint8Array(lh.buffer),nameB,f.data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true);
    ch.setUint16(8,0,true); ch.setUint16(10,0,true);
    ch.setUint16(12,dosT,true); ch.setUint16(14,dosD,true);
    ch.setUint32(16,crc,true); ch.setUint32(20,f.data.length,true); ch.setUint32(24,f.data.length,true);
    ch.setUint16(28,nameB.length,true); ch.setUint16(30,0,true); ch.setUint16(32,0,true);
    ch.setUint16(34,0,true); ch.setUint16(36,0,true);
    ch.setUint32(38,0,true); ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer),nameB);
    offset+=30+nameB.length+f.data.length;
  }
  const csize=central.reduce((s,c)=>s+c.length,0);
  const eo=new DataView(new ArrayBuffer(22));
  eo.setUint32(0,0x06054b50,true); eo.setUint16(4,0,true); eo.setUint16(6,0,true);
  eo.setUint16(8,files.length,true); eo.setUint16(10,files.length,true);
  eo.setUint32(12,csize,true); eo.setUint32(16,offset,true); eo.setUint16(20,0,true);
  return new Blob([...chunks,...central,new Uint8Array(eo.buffer)],{type:'application/zip'});
}

/* ================= IndexedDB (project save/load) ================= */
function idb(){
  return new Promise((res,rej)=>{
    if(!('indexedDB' in window)) return rej(new Error('no idb'));
    const r=indexedDB.open('audio-editor',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv');
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
}
async function dbPut(k,v){
  const db=await idb();
  return new Promise((res,rej)=>{
    const tx=db.transaction('kv','readwrite');
    tx.objectStore('kv').put(v,k);
    tx.oncomplete=()=>{ db.close(); res(); };
    tx.onerror=()=>{ db.close(); rej(tx.error); };
  });
}
async function dbGet(k){
  const db=await idb();
  return new Promise((res,rej)=>{
    const tx=db.transaction('kv','readonly');
    const q=tx.objectStore('kv').get(k);
    q.onsuccess=()=>{ db.close(); res(q.result); };
    q.onerror=()=>{ db.close(); rej(q.error); };
  });
}
async function dbDel(k){
  const db=await idb();
  return new Promise((res,rej)=>{
    const tx=db.transaction('kv','readwrite');
    tx.objectStore('kv').delete(k);
    tx.oncomplete=()=>{ db.close(); res(); };
    tx.onerror=()=>{ db.close(); rej(tx.error); };
  });
}
async function dbKeys(prefix){
  const db=await idb();
  return new Promise((res,rej)=>{
    const tx=db.transaction('kv','readonly');
    const q=tx.objectStore('kv').getAllKeys();
    q.onsuccess=()=>{ db.close(); res((q.result||[]).filter(k=>k.indexOf(prefix)===0)); };
    q.onerror=()=>{ db.close(); rej(q.error); };
  });
}

/* ================= waveform peaks cache (60fps on long files) ================= */
const _pkCache=new WeakMap();
function peaksFor(d){
  let m=_pkCache.get(d.buffer);
  if(!m){ m=new Map(); _pkCache.set(d.buffer,m); }
  let p=m.get(d.byteOffset);
  if(p) return p;
  const len=d.length;
  const STEP=Math.max(16,Math.ceil(len/200000)); /* ≤200k buckets per channel */
  const nb=Math.ceil(len/STEP);
  const mn=new Float32Array(nb),mx=new Float32Array(nb),ab=new Float32Array(nb);
  for(let b=0;b<nb;b++){
    let lo=1,hi=-1,am=0;
    const i1=Math.min(len,(b+1)*STEP);
    for(let i=b*STEP;i<i1;i+=2){ const v=d[i]; if(v<lo)lo=v; if(v>hi)hi=v; const a=v<0?-v:v; if(a>am)am=a; }
    mn[b]=lo;mx[b]=hi;ab[b]=am;
  }
  p={mn,mx,ab,step:STEP};
  m.set(d.byteOffset,p);
  return p;
}

/* ================= waveform drawing ================= */
function drawPeaks(canvas,chData,opt={}){
  const dpr=window.devicePixelRatio||1;
  const w=Math.max(50,canvas.clientWidth||canvas.width), h=Math.max(40,canvas.clientHeight||canvas.height);
  if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); }
  const g=canvas.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,w,h);
  const color=opt.color||'#7d8fd6', midY=h/2;
  const n=chData.length, pk=peaksFor(chData), pkStep=pk.step;
  for(let x=0;x<w;x++){
    let mn=1,mx=-1;
    const i0=Math.floor(x*n/w), i1=Math.min(n,Math.floor((x+1)*n/w));
    if(i1<=i0){ const v=chData[Math.min(n-1,i0)]||0; mn=mx=v; }
    else if(n/w>pkStep){ /* cached bucket pass — O(pixels) */
      const b0=Math.floor(i0/pkStep), b1=Math.max(b0+1,Math.ceil(i1/pkStep));
      for(let b=b0;b<b1;b++){ const lo=pk.mn[b]; if(lo<mn)mn=lo; const hi=pk.mx[b]; if(hi>mx)mx=hi; }
    } else {
      for(let i=i0;i<i1;i+=2){ const v=chData[i]; if(v<mn)mn=v; if(v>mx)mx=v; }
    }
    g.fillStyle=color;
    g.fillRect(x, midY-mx*midY*.92, 1, Math.max(1,(mx-mn)*midY*.92));
  }
  if(opt.mid){ g.fillStyle='rgba(148,163,255,.14)'; g.fillRect(0,midY,w,1); }
  if(typeof opt.sel0==='number'&&typeof opt.sel1==='number'&&opt.sel1>opt.sel0){
    const x0=opt.sel0*w, x1=opt.sel1*w;
    g.fillStyle='rgba(8,13,36,.74)'; g.fillRect(0,0,x0,h); g.fillRect(x1,0,w-x1,h);
    g.strokeStyle='#38bdf8'; g.lineWidth=2; g.strokeRect(x0+1,1,x1-x0-2,h-2);
    g.fillStyle='#38bdf8';
    rr(g,x0-3,h/2-14,6,28,3); g.fill();
    rr(g,x1-3,h/2-14,6,28,3); g.fill();
  }
}

/* ================= dropzone ================= */
function attachDrop(zone,onFiles,accept){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept=accept||'audio/*'; inp.multiple=true; inp.style.display='none';
  zone.appendChild(inp);
  zone.addEventListener('click',()=>inp.click());
  inp.addEventListener('change',()=>{ if(inp.files.length) onFiles(Array.from(inp.files)); inp.value=''; });
  ['dragenter','dragover'].forEach(ev=>zone.addEventListener(ev,e=>{e.preventDefault();zone.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>zone.addEventListener(ev,e=>{e.preventDefault();zone.classList.remove('over');}));
  zone.addEventListener('drop',e=>{ const fs=Array.from(e.dataTransfer.files||[]); if(fs.length) onFiles(fs); });
  return inp;
}

</script>
<script>
'use strict';
/* ================= MULTI-TRACK STUDIO ================= */
const st={
  buffers:{},            // id -> AudioBuffer
  tracks:[],             // {id,name,color,clips,muted,solo,lock}
  sel:null, p:36, playhead:0, playing:false,
  sources:[], master:null, raf:0, startAt:0, nextId:1,
  drag:null,
  snap:true, history:[], histIdx:-1, pointers:new Map(), lofi:false,
};
const RULER=30, LANE=78, MARGIN=132, MIN_DUR=0.05;
const PAL=[['#fbbf24','#d97706'],['#22d3ee','#0284c7'],['#34d399','#059669'],['#e879f9','#c026d3'],
           ['#60a5fa','#2563eb'],['#fb7185','#e11d48'],['#a78bfa','#7c3aed'],['#2dd4bf','#0d9488']];
const stSl=()=>{ const w=$('#studio-scroll'); return w?w.scrollLeft:0; };
const stX=t=>MARGIN+t*st.p-stSl();      /* canvas (viewport) x for time t */
const stT=x=>(x+stSl()-MARGIN)/st.p;    /* time at canvas x (scroll-aware) */
const stCX=t=>MARGIN+t*st.p;            /* content-space x (for scroll math) */
const stBuf=id=>st.buffers[id];
const trackAudible=t=>{ if(t.muted) return false; return st.tracks.some(x=>x.solo)?t.solo:true; };

const stTotal=()=>{ let m=0; for(const t of st.tracks) for(const c of t.clips) m=Math.max(m,c.start+c.len); return m; };
const stSel=()=>{ if(!st.sel) return null; const t=st.tracks[st.sel.t]; if(!t) return null; const c=t.clips[st.sel.c]; return c?{ti:st.sel.t,ci:st.sel.c,t,c}:null; };
function stSelect(ti,ci){ st.sel=(ti==null)?null:{t:ti,c:ci}; stDirty(); }

/* ---- history (undo / redo) ---- */
function stSnapshot(){
  const snap=JSON.stringify({
    nextId:st.nextId,
    tracks:st.tracks.map(t=>({id:t.id,name:t.name,color:t.color,muted:t.muted,solo:t.solo,lock:t.lock,
      clips:t.clips.map(c=>({id:c.id,bufId:c.bufId,start:c.start,offset:c.offset,len:c.len,gain:c.gain,fi:c.fi,fo:c.fo,fc:c.fc,muted:c.muted,speed:c.speed}))})),
  });
  st.history=st.history.slice(0,st.histIdx+1);
  st.history.push(snap);
  if(st.history.length>50) st.history.shift();
  st.histIdx=st.history.length-1;
  stHistUI(); stToolbarUI();
}
function stRestore(snap){
  const d=JSON.parse(snap);
  st.nextId=d.nextId;
  st.tracks=d.tracks.map(t=>Object.assign({},t,{clips:t.clips.map(c=>Object.assign({},c))}));
  st.sel=null;
  if(st.playhead>stTotal()) st.playhead=stTotal();
  stHistUI(); stDirty();
}
function stUndo(){ if(st.histIdx>0){ st.histIdx--; stRestore(st.history[st.histIdx]); toast('Undo'); } }
function stRedo(){ if(st.histIdx<st.history.length-1){ st.histIdx++; stRestore(st.history[st.histIdx]); toast('Redo'); } }
function stHistUI(){ const u=$('#stUndo'),r=$('#stRedo'); if(u)u.disabled=st.histIdx<=0; if(r)r.disabled=st.histIdx>=st.history.length-1; }

/* ---- envelope ---- */
function envAt(kt,dur,fi,fo,fc){
  let e=1;
  if(fi>0&&kt<fi){ const x=kt/fi; e*=fc==='exp'?x*x:x; }
  if(fo>0&&kt>dur-fo){ const x=Math.max(0,dur-kt)/fo; e*=fc==='exp'?x*x:x; }
  return e;
}

function stDirty(){
  if(!st.drag) st.lofi=false;
  const emp=$('#stEmpty'), cv=$('#tl'), sp=$('#stSpacer');
  if(emp&&cv){ const has=st.tracks.length>0; emp.style.display=has?'none':'flex'; cv.style.display=has?'block':'none'; if(sp) sp.style.display=has?'block':'none'; }
  stFrame(); stTimeUI(); stToolbarUI();
}

function rulerStep(p){ const steps=[.25,.5,1,2,5,10,15,30,60,120,300]; for(const s of steps) if(s*p>=64) return s; return 600; }

/* ---- content rendering ---- */
function stRenderContent(){
  const wrap=$('#studio-scroll'); if(!wrap) return;
  const total=Math.max(stTotal(),8);
  const spacer=$('#stSpacer');
  if(spacer){ spacer.style.width=(MARGIN+(total+1.5)*st.p+24)+'px'; }
  /* viewport-sized canvas (sticky) — only what's on screen gets painted */
  const W=Math.max(320,wrap.clientWidth);
  const H=RULER+Math.max(st.tracks.length,1)*LANE+6;
  if(spacer){ spacer.style.height=H+'px'; }
  const dpr=window.devicePixelRatio||1;
  const cv=$('#tl');
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  g.fillStyle='#0a1230'; g.fillRect(0,0,W,H);
  const S=stSl(), t1=(S+W-MARGIN)/st.p;
  /* ruler (visible range only) */
  g.fillStyle='#0d1738'; g.fillRect(0,0,W,RULER);
  g.strokeStyle='rgba(148,163,255,.25)'; g.beginPath(); g.moveTo(0,RULER+.5); g.lineTo(W,RULER+.5); g.stroke();
  const step=rulerStep(st.p), minor=step/5;
  g.font='600 11px system-ui, sans-serif'; g.textBaseline='alphabetic';
  let ri0=Math.max(0,Math.floor((S-MARGIN)/st.p/minor)-1), ri1=Math.ceil(t1/minor);
  for(let i=ri0;i<=ri1;i++){
    const t=i*minor, x=MARGIN+t*st.p-S, major=(i%5===0);
    g.strokeStyle=major?'rgba(148,163,255,.4)':'rgba(148,163,255,.16)';
    g.beginPath(); g.moveTo(x+.5,RULER-(major?11:5)); g.lineTo(x+.5,RULER); g.stroke();
    if(major){
      g.fillStyle='#7d8bc0';
      const lbl=(t>=60&&t%60===0)?(t/60)+'m':String(Number(t.toFixed(2)))+'s';
      g.fillText(lbl,x+4,14);
    }
  }
  /* lanes */
  st.tracks.forEach((t,ti)=>{
    const y=RULER+ti*LANE;
    if(ti%2===1){ g.fillStyle='rgba(148,163,255,.035)'; g.fillRect(MARGIN,y,W-MARGIN,LANE); }
    g.strokeStyle='rgba(148,163,255,.07)'; g.beginPath(); g.moveTo(0,y+LANE+.5); g.lineTo(W,y+LANE+.5); g.stroke();
    /* margin: M / S / lock buttons */
    g.fillStyle='rgba(148,163,255,.05)'; g.fillRect(0,y,MARGIN,LANE);
    g.strokeStyle='rgba(148,163,255,.14)'; g.beginPath(); g.moveTo(MARGIN+.5,0); g.lineTo(MARGIN+.5,H); g.stroke();
    const bxs=[14,48,82], labels=['M','S','lock'];
    bxs.forEach((bx,bi)=>{
      const on=bi===0?t.muted:bi===1?t.solo:t.lock;
      const col=bi===0?'#22d3ee':bi===1?'#fbbf24':'#fb7185';
      rr(g,bx,y+22,26,26,8);
      if(on){ g.fillStyle=col; g.fill(); g.fillStyle='#0a1130'; }
      else { g.fillStyle='rgba(148,163,255,.07)'; g.fill(); g.strokeStyle=col; g.lineWidth=1.4; rr(g,bx,y+22,26,26,8); g.stroke(); g.fillStyle=col; }
      g.font='800 12px system-ui, sans-serif'; g.textBaseline='middle';
      if(bi===0) g.fillText('M',bx+13,y+35.5);
      else if(bi===1) g.fillText('S',bx+13,y+35.5);
      else{
        if(!on) g.strokeStyle=col;
        else g.strokeStyle='#0a1130';
        g.lineWidth=1.6;
        g.strokeRect(bx+9,y+32.5,8,7);
        g.beginPath(); g.arc(bx+13,y+32.5,3.4,Math.PI,0); g.stroke();
      }
    });
    g.font='600 10.5px system-ui, sans-serif'; g.fillStyle='#5c6a99'; g.textBaseline='alphabetic';
    let nm='T'+(ti+1)+'  '+t.name;
    if(g.measureText(nm).width>116){ while(nm.length>5&&g.measureText(nm+'…').width>116) nm=nm.slice(0,-1); nm+='…'; }
    g.fillText(nm,14,y+68);
    /* track name above clips */
    g.font='700 12px system-ui, sans-serif'; g.fillStyle='#93a0c9';
    g.fillText(t.name,MARGIN+10,y+17);
    /* clips (clipped to the timeline area so long clips never cover the pinned M/S/lock column) */
    const audible=trackAudible(t);
    g.save(); g.beginPath(); g.rect(MARGIN,y,W-MARGIN,LANE); g.clip();
    t.clips.forEach((c,ci)=>{
      const x=stX(c.start), w=c.len*st.p, cy=y+26, ch=LANE-34;
      if(w<2) return;
      const [c1,c2]=t.color;
      const selected=st.sel&&st.sel.t===ti&&st.sel.c===ci;
      const grd=g.createLinearGradient(0,cy,0,cy+ch);
      grd.addColorStop(0,c1); grd.addColorStop(1,c2);
      rr(g,x,cy,w,ch,7); g.fillStyle=grd; g.globalAlpha=selected?1:(audible?.85:.35); g.fill(); g.globalAlpha=1;
      /* waveform + clip detection (cached peaks — O(pixels), fast at any zoom) */
      const buf=stBuf(c.bufId);
      let clipped=false;
      if(buf){
        const data=buf.numberOfChannels>1?buf.getChannelData(1):buf.getChannelData(0);
        const sr=buf.sampleRate;
        const i0=Math.floor(c.offset*sr), n=Math.min(Math.floor(c.len*sr),data.length-i0);
        if(n>0&&w>6){
          const pk=peaksFor(data), pkStep=pk.step;
          const rb0=Math.floor(i0/pkStep), rb1=Math.max(rb0+1,Math.ceil((i0+n)/pkStep));
          for(let b=rb0;b<rb1;b++){ if(pk.ab[b]>.999){ clipped=true; break; } }
          if(!st.lofi){ /* low-fidelity while dragging skips this; only the visible slice is drawn */
            const vx0=Math.max(0,x+2), vx1=Math.min(W-1,x+w-2);
            if(vx1>vx0){
              const ta=Math.max(c.start,(S+vx0-MARGIN-2)/st.p), tb=Math.min(c.start+c.len,(S+vx1-MARGIN-2)/st.p);
              if(tb>ta){
                const cols=Math.max(2,Math.min(2400,Math.floor((tb-ta)*st.p)));
                g.save(); g.beginPath(); g.rect(x,cy,Math.max(1,w),ch); g.clip();
                g.strokeStyle='rgba(255,255,255,.72)'; g.lineWidth=1;
                g.beginPath();
                for(let px=0;px<cols;px++){
                  const tA=ta+(tb-ta)*px/cols, tB=Math.max(tA,ta+(tb-ta)*(px+1)/cols);
                  const a=i0+Math.floor((tA-c.start)*sr), b=Math.max(a+1,i0+Math.floor((tB-c.start)*sr));
                  const cb0=Math.floor(a/pkStep), cb1=Math.max(cb0+1,Math.ceil(b/pkStep));
                  let mn=1,mx=-1;
                  for(let bi=cb0;bi<cb1;bi++){ const lo=pk.mn[bi]; if(lo<mn)mn=lo; const hi=pk.mx[bi]; if(hi>mx)mx=hi; }
                  const xx=x+(tA-c.start)*st.p, yy=cy+2+(ch-4)/2;
                  g.moveTo(xx,yy-mx*(ch-4)/2*.88);
                  g.lineTo(xx,yy-mn*(ch-4)/2*.88);
                }
                g.stroke(); g.restore();
              }
            }
          }
        }
      }
      g.font='700 11px system-ui, sans-serif'; g.fillStyle='rgba(0,0,0,.5)';
      g.fillText(t.name,x+8,cy+14);
      if(c.muted){ g.fillStyle='rgba(0,0,0,.45)'; g.font='800 10px system-ui, sans-serif'; g.fillText('MUTED',x+8,cy+ch-7); }
      if(clipped){
        g.fillStyle='#ef4444'; g.beginPath(); g.arc(x+w-12,cy+10,6.5,0,Math.PI*2); g.fill();
        g.fillStyle='#fff'; g.font='800 10px system-ui, sans-serif'; g.textBaseline='middle';
        g.fillText('!',x+w-12,cy+10.5); g.textBaseline='alphabetic';
      }
      if(selected){
        rr(g,x+1,cy+1,Math.max(2,w-2),ch-2,6); g.strokeStyle='#fff'; g.lineWidth=2; g.stroke();
        g.fillStyle='#fff';
        rr(g,x-3,cy+ch/2-11,6,22,3); g.fill();
        rr(g,x+w-3,cy+ch/2-11,6,22,3); g.fill();
      }
    });
    g.restore(); /* end lane clip region */
  });
  /* playhead */
  if(st.tracks.length){
    const px=stX(st.playhead);
    if(px>=-1&&px<=W+1){
      g.strokeStyle='#38bdf8'; g.lineWidth=2;
      g.beginPath(); g.moveTo(px,0); g.lineTo(px,H); g.stroke();
      g.fillStyle='#38bdf8';
      g.beginPath(); g.moveTo(px-6,0); g.lineTo(px+6,0); g.lineTo(px,9); g.closePath(); g.fill();
    }
  }
}

function stFrame(){ stRenderContent(); }

function stTimeUI(){
  const el=$('#stTime'); if(el) el.innerHTML=`<b>${fmtTime(st.playhead)}</b> / ${fmtTime(stTotal())}`;
  const pb=$('#stPlayBtn'); if(pb) pb.innerHTML=st.playing?IC.pause:IC.play;
  const sb=$('#stSnap'); if(sb) sb.classList.toggle('on',st.snap);
}
function stToolbarUI(){
  const s=stSel();
  ['stSplit','stTrim','stDel','stVol','stFi','stFo','stMute','stSpeed','stClean','stRev','stDelT'].forEach(id=>{
    const b=$('#'+id); if(b) b.classList.toggle('off',!s);
  });
  /* live value badges — simple human numbers */
  const bd=(id,txt)=>{ const el=$('#'+id); if(el) el.textContent=txt; };
  bd('stVolV', s?Math.round((s.c.muted?0:s.c.gain)*100)+'%':'');
  bd('stFiV', s&&s.c.fi?s.c.fi.toFixed(1)+'s':'');
  bd('stFoV', s&&s.c.fo?s.c.fo.toFixed(1)+'s':'');
  bd('stMuteV', s&&s.c.muted?'ON':'');
  bd('stSpeedV', s&&s.c.speed&&s.c.speed!==1?s.c.speed.toFixed(1)+'×':'');
  const m=$('#stMute'); if(m&&s) m.classList.toggle('on',!!s.c.muted);
  const bar=$('#stTrackBar'); if(bar) bar.style.display=st.tracks.length?'flex':'none';
  stHistUI();
}

/* ---- playback ---- */
async function stPlay(){
  if(st.playing){ stPause(); return; }
  const c=AC(); if(c.state==='suspended') await c.resume();
  stStopSources();
  if(!st.tracks.length) return toast('Add some audio first');
  const t0=c.currentTime+.08;
  st.master=c.createGain(); st.master.gain.value=.95; st.master.connect(c.destination);
  const nodes=[];
  for(const t of st.tracks){
    if(!trackAudible(t)) continue;
    for(const cl of t.clips){
      const buf=stBuf(cl.bufId); if(!buf) continue;
      const a=Math.max(st.playhead,cl.start), b=cl.start+cl.len;
      if(a>=b-.005) continue;
      const s=c.createBufferSource(); s.buffer=buf;
      const g=c.createGain(); s.connect(g); g.connect(st.master);
      const dur=cl.len, eff=cl.muted?0:cl.gain;
      const kfs=[0,cl.fi?cl.fi/2:0,cl.fi,dur-(cl.fo?cl.fo/2:0),dur-cl.fo,dur]
        .filter(x=>x>=0&&x<=dur).sort((x,y)=>x-y);
      const u=[]; kfs.forEach(x=>{ if(!u.length||x-u[u.length-1]>1e-6) u.push(x); });
      u.forEach((kt,i)=>{
        const v=eff*envAt(kt,dur,cl.fi,cl.fo,cl.fc);
        const at=t0+cl.start+kt;
        if(i===0) g.gain.setValueAtTime(v,at); else g.gain.linearRampToValueAtTime(v,at);
      });
      s.start(t0+a,cl.offset+(a-cl.start));
      s.stop(t0+b+.05);
      nodes.push(s);
    }
  }
  if(!nodes.length) return toast('Nothing to play at this position');
  st.sources=nodes; st.playing=true; st.startAt=t0;
  const total=stTotal();
  const tick=()=>{
    if(!st.playing) return;
    st.playhead=c.currentTime-st.startAt;
    if(st.playhead>=total){ st.playhead=total; stPause(); }
    stFrame(); stTimeUI();
    if(!st.drag){
      const wrap=$('#studio-scroll');
      if(wrap){
        const px=stCX(st.playhead); /* content-space x */
        if(px>wrap.scrollLeft+wrap.clientWidth-80) wrap.scrollLeft=px-wrap.clientWidth+80;
        if(px<wrap.scrollLeft+MARGIN) wrap.scrollLeft=Math.max(0,px-MARGIN-10);
      }
    }
    st.raf=requestAnimationFrame(tick);
  };
  stTimeUI(); tick();
}
function stPause(){ st.playing=false; cancelAnimationFrame(st.raf); stStopSources(); stTimeUI(); }
function stStopSources(){
  st.sources.forEach(s=>{ try{s.stop();}catch(e){} try{s.disconnect();}catch(e){} });
  st.sources=[];
  if(st.master){ try{st.master.disconnect();}catch(e){} st.master=null; }
}
st.zoom=f=>{
  const wrap=$('#studio-scroll'); if(!wrap) return;
  const before=stT(wrap.clientWidth/2); /* time at viewport center */
  st.p=clamp(st.p*f,8,400);
  wrap.scrollLeft=MARGIN+before*st.p-wrap.clientWidth/2;
  stDirty();
};

/* ---- pointer interaction (incl. pinch zoom) ---- */
function stBindPointer(cv){
  const pos=e=>{ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
  const hit=(x,y)=>{
    if(y<RULER) return x<MARGIN?{m:'mruler'}:{m:'ruler'};
    if(x<MARGIN){
      const ti=Math.floor((y-RULER)/LANE);
      const t=st.tracks[ti]; if(!t) return {m:'off'};
      const by=y-(RULER+ti*LANE)-22;
      if(by>=0&&by<=26){
        if(x>=14&&x<40) return {m:'tm',ti};
        if(x>=48&&x<74) return {m:'ts',ti};
        if(x>=82&&x<108) return {m:'tk',ti};
      }
      return {m:'margin'};
    }
    const ti=Math.floor((y-RULER)/LANE);
    const t=st.tracks[ti]; if(!t) return {m:'off'};
    const tt=stT(x);
    for(let i=0;i<t.clips.length;i++){
      const c=t.clips[i], x0=stX(c.start), x1=x0+c.len*st.p;
      if(tt>=c.start-.01&&tt<=c.start+c.len+.01){
        if(Math.abs(x-x0)<9) return {m:'tl',ti,ci:i,c};
        if(Math.abs(x-x1)<9) return {m:'tr',ti,ci:i,c};
        return {m:'body',ti,ci:i,c};
      }
    }
    return {m:'empty',ti};
  };
  const dist=()=>{ const pts=[...st.pointers.values()]; return Math.hypot(pts[0].cx-pts[1].cx,pts[0].cy-pts[1].cy); };
  cv.addEventListener('pointerdown',e=>{
    const {x,y}=pos(e);
    st.pointers.set(e.pointerId,{x,y,cx:e.clientX,cy:e.clientY});
    try{cv.setPointerCapture(e.pointerId);}catch(err){}
    if(st.pointers.size===2){
      const [A,B]=[...st.pointers.values()];
      const wEl=$('#studio-scroll');
      const L0=cv.getBoundingClientRect().left;
      const sl0=wEl?wEl.scrollLeft:0, st0=wEl?wEl.scrollTop:0;
      const mx0=(A.cx+B.cx)/2, my0=(A.cy+B.cy)/2;
      const t0=(mx0-L0+sl0-MARGIN)/st.p;
      st.drag={m:'pinch',d0:dist(),p0:st.p,L0,sl0,st0,mx0,my0,t0};
      return;
    }
    if(st.pointers.size>2) return;
    const h=hit(x,y);
    if(h.m==='ruler'){ st.playhead=clamp(stT(x),0,Math.max(stTotal(),0)); stFrame(); stTimeUI(); st.drag={m:'seek'}; return; }
    if(h.m==='tm'||h.m==='ts'||h.m==='tk'){
      const t=st.tracks[h.ti];
      if(h.m==='tm'){ t.muted=!t.muted; stSnapshot(); }
      else if(h.m==='ts'){ t.solo=!t.solo; stSnapshot(); }
      else { t.lock=!t.lock; stSnapshot(); }
      return;
    }
    if(h.m==='body'){
      stSelect(h.ti,h.ci);
      if(!h.c||st.tracks[h.ti].lock) return;
      st.drag={m:'move',c:h.c,t:h.ti,x0:x,start0:h.c.start,moved:false};
      st.lofi=true; stDirty();
      return;
    }
    if(h.m==='tl'||h.m==='tr'){
      stSelect(h.ti,h.ci);
      if(st.tracks[h.ti].lock) return;
      st.drag={m:h.m,c:h.c,ti:h.ti,x0:x,len0:h.c.len,start0:h.c.start,off0:h.c.offset,moved:false};
      st.lofi=true; stDirty();
      return;
    }
    if(h.m==='empty'){
      stSelect(null);
      const wrap=$('#studio-scroll');
      if(wrap) st.drag={m:'pan',x0:e.clientX,y0:e.clientY,sl0:wrap.scrollLeft,st0:wrap.scrollTop,moved:false};
      return;
    }
  });
  cv.addEventListener('pointermove',e=>{
    const {x,y}=pos(e);
    if(st.pointers.has(e.pointerId)) st.pointers.set(e.pointerId,{x,y,cx:e.clientX,cy:e.clientY});
    if(st.pointers.size>=2){
      if(st.drag&&st.drag.m==='pinch'){
        const d=dist();
        const wrap=$('#studio-scroll'); if(!wrap) return;
        const [A,B]=[...st.pointers.values()];
        const mx=(A.cx+B.cx)/2, my=(A.cy+B.cy)/2;
        st.p=clamp(st.drag.p0*d/Math.max(1,st.drag.d0),8,400);
        wrap.scrollLeft=st.drag.L0+MARGIN+st.drag.t0*st.p-mx;
        wrap.scrollTop=st.drag.st0-(my-st.drag.my0);
        stDirty();
      }
      return;
    }
    if(!st.drag){
      const h=hit(x,y);
      cv.style.cursor=(h.m==='tl'||h.m==='tr')?'ew-resize':((h.m==='body'||h.m==='empty')?'grab':(h.m==='ruler'?'pointer':(h.m==='tm'||h.m==='ts'||h.m==='tk'?'pointer':'default')));
      return;
    }
    const d=st.drag;
    if(d.m==='seek'){ st.playhead=clamp(stT(x),0,Math.max(stTotal(),0)); stFrame(); stTimeUI(); return; }
    if(d.m==='pan'){
      const wrap=$('#studio-scroll'); if(!wrap) return;
      wrap.scrollLeft=d.sl0-(e.clientX-d.x0); wrap.scrollTop=d.st0-(e.clientY-d.y0); d.moved=true; return;
    }
    const t=st.tracks[d.ti];
    if(d.m==='move'){
      let ns=Math.max(0,d.start0+(x-d.x0)/st.p);
      if(st.snap){
        const snapped=Math.round(ns/.25)*.25;
        if(Math.abs(ns-snapped)<.15) ns=snapped;
        if(Math.abs(st.playhead-ns)<.15) ns=st.playhead;
      }
      d.c.start=ns; d.moved=true; stDirty(); return;
    }
    const dt=(x-d.x0)/st.p;
    if(d.m==='tl'){
      let nd=clamp(dt,-d.off0,d.len0-MIN_DUR);
      if(st.snap){
        let ns=d.start0+nd, s2=Math.round(ns/.25)*.25;
        if(Math.abs(ns-s2)<.15) nd=s2-d.start0;
        if(Math.abs(st.playhead-ns)<.15) nd=st.playhead-d.start0;
        nd=clamp(nd,-d.off0,d.len0-MIN_DUR);
      }
      d.c.start=d.start0+nd; d.c.offset=d.off0+nd; d.c.len=d.len0-nd; d.moved=true;
    }else if(d.m==='tr'){
      const maxExt=(stBuf(d.c.bufId)?.duration||0)-d.off0-d.len0;
      let nd=clamp(dt,-(d.len0-MIN_DUR),maxExt);
      if(st.snap){
        let ne=d.start0+d.len0+nd, s2=Math.round(ne/.25)*.25;
        if(Math.abs(ne-s2)<.15) nd=s2-d.start0-d.len0;
        if(Math.abs(st.playhead-ne)<.15) nd=st.playhead-d.start0-d.len0;
        nd=clamp(nd,-(d.len0-MIN_DUR),maxExt);
      }
      d.c.len=d.len0+nd; d.moved=true;
    }
    stDirty();
  });
  const up=e=>{
    st.pointers.delete(e.pointerId);
    if(st.drag){
      if(st.drag.m==='pinch'){ if(st.pointers.size<2) st.drag=null; return; }
      if(st.drag.moved&&st.drag.m!=='pan') stSnapshot();
      st.drag=null;
      if(st.lofi){ st.lofi=false; stDirty(); } /* restore full-quality waveforms */
    }
  };
  cv.addEventListener('pointerup',up);
  cv.addEventListener('pointercancel',up);
}

/* ---- clip ops ---- */
const locked=()=>{ const s=stSel(); if(s&&s.t.lock){ toast('Track is locked'); return true; } return false; };
function stNeedSel(){ const s=stSel(); if(!s){ toast('Select a clip first — tap any clip on the timeline'); return null; } return s; }
function stSplitAt(){
  const s=stNeedSel(); if(!s) return; if(locked()) return;
  const pos=st.playhead, c=s.c;
  if(pos<=c.start+.03||pos>=c.start+c.len-.03) return toast('Move the playhead inside the selected clip');
  const l=pos-c.start;
  const right={id:st.nextId++,bufId:c.bufId,start:pos,offset:c.offset+l,len:c.len-l,gain:c.gain,fi:0,fo:c.fo,fc:c.fc,muted:c.muted,speed:c.speed};
  c.len=l; c.fo=0;
  s.t.clips.splice(s.ci+1,0,right);
  stSelect(s.ti,s.ci);
  stSnapshot();
  toast('Split at '+fmtTime(pos));
}
function stTrimToPlayhead(which){
  const s=stSel(); if(!s||locked()) return;
  const c=s.c, p=st.playhead;
  if(p<=c.start+.01||p>=c.start+c.len-.01) return toast('Move the playhead inside the clip');
  if(which==='start'){ const d=p-c.start; c.start=p; c.offset+=d; c.len-=d; }
  else c.len=p-c.start;
  stSnapshot(); toast('Trimmed');
}
function stDeleteClip(){ const s=stNeedSel(); if(!s) return; if(locked()) return; s.t.clips.splice(s.ci,1); if(!s.t.clips.length) st.tracks.splice(s.ti,1); stSelect(null); stSnapshot(); toast('Clip deleted'); }
function stDeleteTrack(){ const s=stNeedSel(); if(!s) return; st.tracks.splice(s.ti,1); stSelect(null); stSnapshot(); toast('Track deleted'); }
function stMuteClip(){ const s=stNeedSel(); if(!s) return; if(locked()) return; s.c.muted=!s.c.muted; stSnapshot(); toast(s.c.muted?'Muted':'Unmuted'); }
function stSetVolume(v){ const s=stSel(); if(!s) return; if(s.c.muted) s.c.muted=false; s.c.gain=v; }
function stSetFade(k,v){ const s=stSel(); if(!s) return; s.c[k]=v; }
function stSetCurve(fc){ const s=stSel(); if(!s) return; s.c.fc=fc; }

function resampleBuf(buf,ratio){
  const newLen=Math.max(1,Math.round(buf.length*ratio));
  const out=AC().createBuffer(buf.numberOfChannels,newLen,buf.sampleRate);
  for(let ch=0;ch<buf.numberOfChannels;ch++){
    const d=buf.getChannelData(ch), o=out.getChannelData(ch);
    const r=buf.length/newLen;
    for(let i=0;i<o.length;i++){
      const t=i*r, i0=Math.floor(t), i1=Math.min(d.length-1,i0+1), f=t-i0;
      o[i]=d[i0]*(1-f)+d[i1]*f;
    }
  }
  return out;
}
function stApplySpeed(speed){
  const s=stSel(); if(!s||locked()) return;
  const c=s.c, s1=c.speed||1;
  if(Math.abs(s1-speed)<1e-3) return;
  const buf=stBuf(c.bufId); if(!buf) return;
  const factor=s1/speed;
  const nb=resampleBuf(buf,factor);
  const bid=st.nextId++; st.buffers[bid]=nb;
  c.bufId=bid; c.offset*=factor; c.len*=factor; c.speed=speed;
  if(c.len<MIN_DUR) c.len=MIN_DUR;
  stSnapshot();
  toast('Speed '+speed.toFixed(1)+'×');
}
function stReverse(){
  const s=stNeedSel(); if(!s) return; if(locked()) return;
  const c=s.c, buf=stBuf(c.bufId); if(!buf) return;
  const out=AC().createBuffer(buf.numberOfChannels,buf.length,buf.sampleRate);
  for(let ch=0;ch<buf.numberOfChannels;ch++){
    const d=buf.getChannelData(ch), o=out.getChannelData(ch);
    for(let i=0;i<d.length;i++) o[i]=d[buf.length-1-i];
  }
  const bid=st.nextId++; st.buffers[bid]=out; c.bufId=bid;
  stSnapshot(); toast('Reversed');
}
async function stDenoiseClip(){
  const s=stNeedSel(); if(!s) return; if(locked()) return;
  const c=s.c, buf=stBuf(c.bufId); if(!buf) return;
  toast('AI cleaning clip…',1600);
  await sleep(30);
  try{
    const seg=sliceBuf(buf,c.offset,c.offset+c.len);
    const clean=await denoiseBuffer(seg,1.6,null);
    const bid=st.nextId++; st.buffers[bid]=clean;
    c.bufId=bid; c.offset=0;
    stSnapshot(); toast('Clip cleaned');
  }catch(e){ console.warn(e); toast('Cleaning failed'); }
}

async function stAddFiles(files){
  let added=0;
  for(const f of files){
    try{
      const buf=await decodeFile(f);
      const bid=st.nextId++; st.buffers[bid]=buf;
      const track={id:st.nextId++,name:stripExt(f.name),color:PAL[st.tracks.length%PAL.length],clips:[],muted:false,solo:false,lock:false};
      track.clips.push({id:st.nextId++,bufId:bid,start:0,offset:0,len:buf.duration,gain:1,fi:0,fo:0,fc:'lin',muted:false,speed:1});
      st.tracks.push(track); added++;
    }catch(err){ toast("Couldn't decode "+f.name); }
  }
  if(added){ stSnapshot(); stDirty(); toast(added+' track'+(added>1?'s':'')+' added'); }
}

async function renderStudioMix(){
  const c=AC(), sr=c.sampleRate;
  const total=stTotal();
  const n=Math.ceil(total*sr)+Math.floor(sr*.3);
  const out=c.createBuffer(2,n,sr);
  const L=out.getChannelData(0), R=out.getChannelData(1);
  for(const t of st.tracks){
    if(!trackAudible(t)) continue;
    for(const cl of t.clips){
      const g0=cl.muted?0:cl.gain; if(g0<=0) continue;
      const nb=stBuf(cl.bufId); if(!nb||nb.sampleRate!==sr) continue;
      const d0=nb.getChannelData(0);
      const d1=nb.numberOfChannels>1?nb.getChannelData(1):d0;
      const i0=Math.floor(cl.offset*sr);
      const lenS=Math.min(Math.floor(cl.len*sr),nb.length-i0);
      const s0=Math.floor(cl.start*sr);
      const fi=cl.fi, fo=cl.fo, clen=cl.len, fc=cl.fc;
      for(let i=0;i<lenS;i++){
        const idx=s0+i; if(idx>=n) break;
        const e=envAt(i/sr,clen,fi,fo,fc)*g0;
        L[idx]+=d0[i0+i]*e;
        R[idx]+=d1[i0+i]*e;
      }
      await sleep(0);
    }
  }
  let peak=0;
  for(let i=0;i<n;i++){ const a=Math.abs(L[i]),b=Math.abs(R[i]); if(a>peak)peak=a; if(b>peak)peak=b; }
  if(peak>1.0001){ const s=1.3,ns=Math.tanh(s); for(let i=0;i<n;i++){ L[i]=Math.tanh(L[i]*s)/ns; R[i]=Math.tanh(R[i]*s)/ns; } }
  return out;
}

/* ---- popovers ---- */
function stPopover(anchor,title,o){
  closePopover();
  const r=anchor.getBoundingClientRect();
  const pop=document.createElement('div'); pop.className='pop'; pop.id='stPop';
  pop.innerHTML=`<div class="pop-h">${title} <span class="pop-v" id="popV"></span></div>
    <input type="range" class="slider" id="popR" min="${o.min}" max="${o.max}" step="${o.step}">
    ${o.extra||''}
    <div class="row mt" style="justify-content:flex-end"><button class="btn ghost small" id="popX">Done</button></div>`;
  document.body.appendChild(pop);
  pop.style.top=(r.bottom+10)+'px';
  pop.style.left=clamp(r.left-70,8,Math.max(8,window.innerWidth-pop.offsetWidth-10))+'px';
  const range=$('#popR',pop);
  range.value=o.get();
  const upd=()=>{ $('#popV',pop).textContent=o.fmt(+range.value); };
  range.oninput=()=>{ o.set(+range.value); upd(); stToolbarUI(); };
  range.onchange=()=>{ stSnapshot(); };
  upd();
  if(o.ready) o.ready(pop);
  $('#popX',pop).onclick=closePopover;
  setTimeout(()=>{
    const h=e=>{ if(!pop.contains(e.target)&&!anchor.contains(e.target)) closePopover(); };
    document.addEventListener('pointerdown',h,{once:true});
  },0);
}
function stSimplePop(anchor,title,inner,cb){
  closePopover();
  const r=anchor.getBoundingClientRect();
  const pop=document.createElement('div'); pop.className='pop'; pop.id='stPop';
  pop.innerHTML=`<div class="pop-h">${title}</div>${inner}
    <div class="row mt" style="justify-content:flex-end"><button class="btn ghost small" id="popX">Done</button></div>`;
  document.body.appendChild(pop);
  pop.style.top=(r.bottom+10)+'px';
  pop.style.left=clamp(r.left-70,8,Math.max(8,window.innerWidth-pop.offsetWidth-10))+'px';
  cb&&cb(pop);
  $('#popX',pop).onclick=closePopover;
  setTimeout(()=>{
    const h=e=>{ if(!pop.contains(e.target)&&!anchor.contains(e.target)) closePopover(); };
    document.addEventListener('pointerdown',h,{once:true});
  },0);
}
function closePopover(){ const p=$('#stPop'); if(p) p.remove(); }

function stJumpPop(anchor){
  stSimplePop(anchor,'Jump to time',
   `<input class="inp" id="jumpInp" style="width:100%" placeholder="e.g. 0:42 or 42.5" inputmode="decimal">`,
   pop=>{
     const inp=$('#jumpInp',pop);
     inp.focus();
     const go=()=>{
       const v=inp.value.trim();
       let t=NaN;
       const m=v.match(/^(\d+):([0-5]?\d)(?:\.(\d+))?$/);
       if(m) t=+m[1]*60+ +m[2]+ (m[3]?+('0.'+m[3]):0);
       else if(/^\d+(\.\d+)?$/.test(v)) t=+v;
       if(!isFinite(t)||t<0){ toast('Invalid time'); return; }
       st.playhead=clamp(t,0,Math.max(stTotal(),t));
       stDirty(); closePopover();
     };
     inp.addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
     inp.addEventListener('blur',()=>{ if(document.activeElement===inp) setTimeout(closePopover,150); });
   });
}

/* ---- projects: save/load full sessions in IndexedDB ---- */
function stProjectsModal(){
  openModal(`
    <h3>Projects</h3>
    <p class="muted">Save your whole session — every track, clip and setting — in this browser. Files never leave your device.</p>
    <div class="row" style="margin:14px 0">
      <input class="inp" id="prjName" placeholder="Project name" style="flex:1">
      <button class="btn primary" id="prjSave">${IC.save} Save current</button>
    </div>
    <div id="prjList"></div>
    <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn ghost" id="prjClose">Close</button></div>
  `);
  $('#prjClose').onclick=closeModal;
  $('#prjSave').onclick=async()=>{
    if(!st.tracks.length) return toast('Nothing to save yet');
    const nm=$('#prjName').value.trim()||('Project '+new Date().toLocaleString());
    await stSaveProject(nm);
    $('#prjName').value='';
    stProjDraw();
  };
  stProjDraw();
}
async function stSaveProject(nm){
  const id='proj:'+Date.now().toString(36);
  const payload={
    id, name:nm, savedAt:Date.now(),
    nTracks:st.tracks.length,
    nClips:st.tracks.reduce((n,t)=>n+t.clips.length,0),
    tracks:st.tracks.map(t=>({id:t.id,name:t.name,color:t.color,muted:t.muted,solo:t.solo,lock:t.lock,
      clips:t.clips.map(c=>({id:c.id,bufId:c.bufId,start:c.start,offset:c.offset,len:c.len,gain:c.gain,fi:c.fi,fo:c.fo,fc:c.fc,muted:c.muted,speed:c.speed}))})),
    buffers:{}
  };
  for(const [bid,ab] of Object.entries(st.buffers)){
    payload.buffers[bid]={ch:ab.numberOfChannels,sr:ab.sampleRate,len:ab.length,data:[]};
    for(let c=0;c<ab.numberOfChannels;c++) payload.buffers[bid].data.push(ab.getChannelData(c).slice());
  }
  await dbPut(id,payload);
  toast('Project saved in this browser');
}
async function stProjDraw(){
  const box=$('#prjList'); if(!box) return;
  const keys=await dbKeys('proj:');
  const items=[];
  for(const k of keys){ const p=await dbGet(k); if(p) items.push(p); }
  items.sort((a,b)=>b.savedAt-a.savedAt);
  box.innerHTML=items.length?items.map(p=>`
    <div class="file-row" style="border-color:var(--line)">
      <div class="file-ic">${IC.layers}</div>
      <div class="file-meta"><div class="fm-n">${esc(p.name)}</div>
      <div class="fm-s">${p.nTracks} track${p.nTracks>1?'s':''} · ${p.nClips} clip${p.nClips>1?'s':''} · ${new Date(p.savedAt).toLocaleString()}</div></div>
      <button class="btn small" data-pl="${p.id}">Load</button>
      <button class="btn ghost small" data-pd="${p.id}">${IC.trash}</button>
    </div>`).join('')
   :'<div class="muted" style="font-size:13px">No saved projects yet.</div>';
  $$('#prjList [data-pl]').forEach(b=>b.onclick=async()=>{
    const p=await dbGet(b.dataset.pl);
    if(!p) return toast('Project not found');
    if(st.playing) stPause();
    stStopSources();
    st.buffers={};
    for(const [bid,bb] of Object.entries(p.buffers)){
      const ab=AC().createBuffer(bb.ch,bb.len,bb.sr);
      for(let c=0;c<bb.ch;c++) ab.getChannelData(c).set(bb.data[c]);
      st.buffers[bid]=ab;
    }
    st.tracks=p.tracks.map(t=>Object.assign({},t,{clips:t.clips.map(c=>Object.assign({},c))}));
    st.sel=null; st.playhead=0;
    st.history=[]; st.histIdx=-1; stSnapshot();
    stDirty();
    closeModal();
    toast('Project loaded');
  });
  $$('#prjList [data-pd]').forEach(b=>b.onclick=async()=>{
    await dbDel(b.dataset.pd); stProjDraw(); toast('Project deleted');
  });
}
